; Standalone sonar coprocessor target for the owner's classic ESP32 DevKitC V4.
; Compile-only profile: the current firmware deliberately leaves sonar hardware disarmed.
[platformio]
core_dir = ../.platformio
default_envs = devkitc_v4_compile
src_dir = src
include_dir = src

[env:devkitc_v4_compile]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Fail closed: keep the same upload denial used by the Boat firmware.
upload_protocol = custom
upload_command = python ../Boat/tools/pio_deny_upload.py
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
  -D FLYTEC_SONAR_COPROCESSOR=1
  -D FLYTEC_SONAR_HARDWARE_ENABLED=0
  -I src
build_src_filter =
  +<*.cpp>
  -<*.ino>
lib_deps =
