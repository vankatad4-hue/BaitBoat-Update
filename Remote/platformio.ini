; Flytec V080 Remote - PRIMARY VS Code + PlatformIO development target (R30H-10).
; Build-only environment: no physical acceptance and upload remains DENIED.
; PlatformIO espressif32 8.0.0 / Arduino 3.3.12, dual target CI PASS (#45063024581).
; Legacy Arduino CLI esp32:esp32@3.0.2 retained as secondary regression.
[platformio]
default_envs = remote_waveshare_43_diagnostic
src_dir = source
include_dir = source

[env:remote_waveshare_43_diagnostic]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Compile only: deliberately block PlatformIO's Upload action.
upload_protocol = custom
upload_command = python tools/pio_deny_upload.py
; Waveshare ESP32-S3-Touch-LCD-4.3 Standard (not 4.3B): 16MB flash,
; OPI PSRAM. Follow actual Waveshare PCB variant, not generic DevKit pin map.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728
build_flags =
  -D FLYTEC_PLATFORMIO_BUILD=1
  -D BOARD_HAS_PSRAM
  -D LV_CONF_INCLUDE_SIMPLE
  -D ESP_PANEL_BOARD_DEFAULT_USE_CUSTOM=1
  -I source
; Remote sketch is located at the src_dir root. PlatformIO automatically
; translates its .ino into one .ino.cpp compilation unit. Do NOT include it
; from a second .cpp adapter or setup()/loop() will be linked twice.
build_src_filter =
  +<*.cpp>
  +<*.c>
  +<*.ino>
  -<*.svg>
# Arduino core 3.3.x Network.h may be dropped from WiFi dependencies when
# preprocessor-aware LDF deep+ is used; keep transitive discovery with deep.
lib_ldf_mode = deep
lib_deps =
  lvgl/lvgl @ 9.6.0
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.0
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.0.1
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.1.2
; The project-specific esp_panel_board_custom_conf.h and lv_conf.h live in source/.
; Font flytec_bg_14.c/.generated.h must be generated from a licensed local
; font (see Remote/tools/generate_bg_font.sh); never commit font binaries.
; RF pin / E22 bridge safety audit flags intentionally remain disabled.

; R30H-90: explicit standalone bench; no normal application source or upload.
[env:remote_dual_core_bench]
extends = env:remote_waveshare_43_diagnostic
build_flags =
  -D BOARD_HAS_PSRAM
  -D FLYTEC_DUAL_CORE_BENCH=1
build_src_filter =
  -<*>
  +<dual_core_bench.cpp>
lib_deps =

; R30H-114: standalone simulated PHY/dispatcher bench, upload still denied.
[env:remote_i2c_integrated_bench]
extends = env:remote_waveshare_43_diagnostic
build_flags =
  -D BOARD_HAS_PSRAM
  -D FLYTEC_I2C_INTEGRATED_BENCH=1
build_src_filter =
  -<*>
  +<remote_i2c_integrated_bench.cpp>
lib_deps =
