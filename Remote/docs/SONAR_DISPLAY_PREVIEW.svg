  <text x="52" y="625" fill="#bcd1dc" font-family="Arial,sans-serif" font-size="13">Circle diameter scales with measured depth × candidate beam coverage. Green line shows boat heading; ring pings do not indicate fish direction.</text>
  <text x="52" y="650" fill="#e2a99d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Current button stops Remote-side processing only; Sonar ESP32 sleep/wake needs a Boat-to-Sonar control link.</text>
  <text x="52" y="670" fill="#9cb6c8" font-family="Arial,sans-serif" font-size="12">Candidate ping alert is software-generated; audible output needs a connected speaker/buzzer (none is onboard this Remote revision).</text>
