25" rx="12" fill="#fff" stroke="#a8bacb" stroke-width="2"/><text x="65" y="670" class="b">OPEN ITEMS BEFORE ELECTRICAL FREEZE</text><text x="65" y="700" class="s">• Confirm battery cells, BMS, fuse, charging and converter rails, thermal behavior and safe pack construction.</text><text x="65" y="730" class="s">• Freeze GPIO/pin mapping, connector pinouts, input matrix, radio wiring and USB routing after actual board is selected.</text><text x="65" y="750" class="s">• Backup radio remains restricted to STOP / safe RETURN HOME; release commands are not permitted over backup.</text></svg>