 y="286">Joystick R</text><text x="270" y="426">nRF24 PA/LNA</text><text x="930" y="426">E22 26×16 module</text><text x="600" y="460">Touchscreen ESP32 PCB</text><text x="600" y="483" class="s">behind 4.3-inch display</text><text x="600" y="650">1S4P battery pack</text><text x="600" y="670" class="s">4 × 18650 • envelope TBD</text><text x="430" y="700">Charge / protection</text><text x="790" y="700">DC/DC converter</text><text x="600" y="580">PWR distribution</text></g><g class="t s"><text x="145" y="170">Primary antenna feed</text><text x="1040" y="170" text-anchor="end">Backup antenna feed</text><text x="170" y="765">USB-C opening at lower edge</text><text x="1030" y="765" text-anchor="end">Switching-power wiring zone</text></g><rect x="70" y="790" width="1060" height="125" rx="16" fill="#fff" stroke="#bdc8d3" stroke-width="2"/><g class="t"><text x="95" y="824" class="b">Layout rules</text><text x="95" y="853" class="s">• Keep RF modules near antenna exits and switching converters away from RF/joystick wiring.</text><text x="95" y="880" class="s">• Battery low/center; power boards near lower edge; route harnesses clear of flex cable and joystick travel.</text><text x="95" y="904" class="s" font-weight="bold">Blocks are approximate envelopes. Component selection, collision checks, clearances and battery safety remain open.</text></g></svg>