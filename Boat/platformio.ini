; Flytec V080 Boat - PRIMARY VS Code + PlatformIO development target (R30H-10).
; Build-only environment: not hardware/release authorization; upload remains DENIED.
; PlatformIO espressif32 8.0.0 / Arduino 3.3.12, dual target CI PASS (#45063024581).
; Legacy Arduino CLI esp32:esp32@3.0.2 retained as secondary regression.
[platformio]
default_envs = boat_n32r16v_diagnostic
src_dir = source
include_dir = source

[env:boat_n32r16v_diagnostic]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Compile only: deliberately block PlatformIO's Upload action.
upload_protocol = custom
upload_command = python tools/pio_deny_upload.py
; ESP32-S3-WROOM-2-N32R16V: 32 MB OPI flash + 16 MB OPI PSRAM.
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_upload.flash_size = 32MB
; Intentionally mirror the existing diagnostic-only huge_app partition.
; This is NOT a reviewed 32 MB OTA layout.
board_build.partitions = huge_app.csv
board_upload.maximum_size = 3145728
build_flags =
  -D FLYTEC_PLATFORMIO_BUILD=1
  -D BOARD_HAS_PSRAM
  -I source
build_src_filter =
  +<*.cpp>
  +<*.c>
  -<*.ino>
  -<firmware/**>
lib_ldf_mode = deep
lib_deps =
  nrf24/RF24 @ 1.4.11
 ; All physical RF and actuator audit flags remain 0 in original headers.
; No tracker_commissioned_config.h or real radio secret is supplied here.

; R30H-90: explicit standalone bench; no normal application source or upload.
[env:boat_dual_core_bench]
extends = env:boat_n32r16v_diagnostic
build_flags =
  -D BOARD_HAS_PSRAM
  -D FLYTEC_DUAL_CORE_BENCH=1
build_src_filter =
  -<*>
  +<dual_core_bench.cpp>
lib_deps =
