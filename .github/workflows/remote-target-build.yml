name: Remote target compile — Waveshare ESP32-S3-Touch-LCD-4.3 Standard

on:
  push:
    branches:
      - hardware-ready-dual-radio-r1
    paths:
      - 'Remote/source/**'
      - '.github/workflows/remote-target-build.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index

      - name: Install pinned ESP32 core
        run: arduino-cli core install esp32:esp32@3.0.2

      - name: Install pinned libraries
        run: |
          arduino-cli lib install "LVGL@9.6.0"
          arduino-cli lib install "ESP32_Display_Panel@1.0.0"
          arduino-cli lib install "ESP32_IO_Expander@1.0.1"
          arduino-cli lib install "esp-lib-utils@0.1.2"

      - name: Record toolchain and library versions
        run: |
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list

      - name: Compile Remote for ESP32-S3 (16 MB flash, OPI PSRAM)
        run: |
          arduino-cli compile --verbose --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi' Remote/source

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-target-build-log
          path: |
            **/*.log
          if-no-files-found: ignore
