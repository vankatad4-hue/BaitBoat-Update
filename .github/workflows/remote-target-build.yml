name: Remote target compile — Waveshare ESP32-S3-Touch-LCD-4.3 Standard

on:
  push:
    branches:
      - hardware-ready-dual-radio-r1
    paths:
      - 'Remote/source/**'
      - 'Remote/tools/generate_bg_font.sh'
      - '.github/workflows/remote-target-build.yml'
  workflow_dispatch:

concurrency:
  group: remote-target-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index

      - name: Install pinned ESP32 core
        run: arduino-cli core install esp32:esp32@3.0.2

      - name: Install pinned libraries
        run: |
          arduino-cli lib install "LVGL@9.6.0"
          arduino-cli lib install "ESP32_Display_Panel@1.0.0"
          arduino-cli lib install "ESP32_IO_Expander@1.0.1"
          arduino-cli lib install "esp-lib-utils@0.1.2"

      - name: Record toolchain and library versions
        run: |
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate licensed Bulgarian UI font
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          bash Remote/tools/generate_bg_font.sh
      - name: Stage sketch and LVGL config
        run: |
          mkdir -p /tmp/FlytecRemoteBuild "$HOME/Arduino"
          cp Remote/source/* /tmp/FlytecRemoteBuild/
          cp out/ui-font/flytec_bg_14.c out/ui-font/flytec_bg_14.generated.h /tmp/FlytecRemoteBuild/
          cp out/ui-font/FONT_LICENSE.txt /tmp/FlytecRemoteBuild/
          mv /tmp/FlytecRemoteBuild/Flytec_Remote.ino /tmp/FlytecRemoteBuild/FlytecRemoteBuild.ino
          cp /tmp/FlytecRemoteBuild/lv_conf.h "$HOME/Arduino/lv_conf.h"

      - name: Compile complete Remote sketch (16 MB flash, OPI PSRAM, huge application partition)
        run: |
          set -o pipefail
          # Default partition is only 1.25 MiB; the app requires a larger partition.
          # huge_app allocates more app space. Offline map data stays on SD card.
          arduino-cli compile --verbose --export-binaries --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=huge_app' /tmp/FlytecRemoteBuild 2>&1 | tee /tmp/remote-target-build.log

      - name: Upload compiled firmware binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flytec-remote-firmware
          path: /tmp/FlytecRemoteBuild/build/esp32.esp32.esp32s3/**
          if-no-files-found: error

      - name: Upload licensed generated font resource
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flytec-bg-font-build
          path: out/ui-font/
          if-no-files-found: ignore

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-target-build-log
          path: /tmp/remote-target-build.log
          if-no-files-found: ignore
