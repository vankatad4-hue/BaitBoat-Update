name: Remote portable host tests

on:
  push:
    branches:
      - hardware-ready-dual-radio-r1
    paths:
      - 'Remote/source/**'
      - 'Remote/tests/**'
      - '.github/workflows/remote-host-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Remote/source/**'
      - 'Remote/tests/**'
      - '.github/workflows/remote-host-tests.yml'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: g++ --version
      - name: Release guard unit test and scanner syntax
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source -IRemote/tests/stubs \
            Remote/source/boat_state.cpp Remote/source/release_button_guard.cpp Remote/tests/release_guard_unit_test.cpp \
            -o /tmp/remote_release_guard
          /tmp/remote_release_guard
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/stubs -IRemote/source \
            -fsyntax-only Remote/source/physical_button_scanner.cpp Remote/source/release_button_guard.cpp
      - name: Payload codec
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/source/radio_payload_codec.cpp Remote/tests/radio_payload_codec_test.cpp \
            -o /tmp/remote_payload_codec
          /tmp/remote_payload_codec
      - name: ACK tracker
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/source/radio_payload_codec.cpp Remote/source/radio_ack_tracker.cpp \
            Remote/tests/radio_ack_tracker_test.cpp -o /tmp/remote_ack_tracker
          /tmp/remote_ack_tracker
      - name: Telemetry freshness
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/stubs -IRemote/source \
            Remote/source/boat_telemetry.cpp Remote/source/radio_payload_codec.cpp \
            Remote/tests/boat_telemetry_test.cpp -o /tmp/remote_telemetry
          /tmp/remote_telemetry
      - name: Lake storage isolation and simulated SD recovery
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/lake_stubs -IRemote/source \
            Remote/source/lake_storage.cpp Remote/tests/lake_storage_test.cpp -o /tmp/remote_lake_storage
          /tmp/remote_lake_storage
      - name: Mission record serialization and recovery
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/lake_stubs -IRemote/source \
            Remote/source/lake_storage.cpp Remote/source/mission_storage.cpp Remote/tests/mission_storage_test.cpp -o /tmp/remote_mission_storage
          /tmp/remote_mission_storage
      - name: Map manifest and coverage parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/lake_stubs -IRemote/source \
            Remote/source/map_pack_manifest.cpp Remote/source/offline_map_coverage.cpp Remote/tests/map_pack_test.cpp -o /tmp/remote_map_pack
          /tmp/remote_map_pack
      - name: Mission protocol and state simulation (Remote and Boat codecs)
        run: |
          cmp Remote/source/mission_wire.h Boat/source/mission_wire.h
          cmp Remote/source/radio_protocol.h Boat/source/radio_protocol.h
          cmp Remote/source/mission_protocol.h Boat/source/mission_protocol.h
          cmp Remote/source/mission_protocol.cpp Boat/source/mission_protocol.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/source/mission_protocol.cpp Remote/source/mission_lifecycle.cpp Remote/tests/mission_protocol_test.cpp -o /tmp/remote_mission_protocol
          /tmp/remote_mission_protocol
      - name: Map projection and pan boundaries
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/lake_stubs -IRemote/source \
            Remote/source/map_projection.cpp Remote/tests/map_projection_test.cpp -o /tmp/remote_map_projection
          /tmp/remote_map_projection
      - name: Physical input debounce and release arbitration
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/button_stubs -IRemote/source -IRemote/tests/stubs \
            Remote/source/boat_state.cpp Remote/source/physical_button_scanner.cpp Remote/source/release_button_guard.cpp Remote/tests/physical_button_test.cpp -o /tmp/remote_button_input
          /tmp/remote_button_input
      - name: Map copy failure and cancellation
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/lake_stubs -IRemote/source \
            Remote/source/map_copy.cpp Remote/source/lake_storage.cpp Remote/tests/map_copy_test.cpp -o /tmp/remote_map_copy
          /tmp/remote_map_copy
      - name: Cooperative offline SD tile loader
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/lake_stubs -IRemote/source \
            Remote/source/offline_map.cpp Remote/source/offline_map_coverage.cpp Remote/source/map_pack_manifest.cpp Remote/source/lake_storage.cpp Remote/tests/offline_tile_test.cpp -o /tmp/remote_tile_loader
          /tmp/remote_tile_loader
