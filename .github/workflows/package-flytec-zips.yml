name: Package Flytec project ZIPs

on:
  push:
    branches:
      - hardware-ready-dual-radio-r1
      - platformio-unified-r30h20
    paths:
      - 'Remote/**'
      - 'Boat/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'Flytec_V080.code-workspace'
      - '.github/workflows/package-flytec-zips.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Remote/**'
      - 'Boat/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'Flytec_V080.code-workspace'
      - '.github/workflows/package-flytec-zips.yml'
  workflow_dispatch:

concurrency:
  group: flytec-branch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Read archive versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_VERSION="$(tr -d '\r\n ' < Remote/releases/VERSION)"
          BOAT_VERSION="$(tr -d '\r\n ' < Boat/releases/VERSION)"
          [[ "$REMOTE_VERSION" =~ ^[0-9]{3}$ ]]
          [[ "$BOAT_VERSION" =~ ^[0-9]{3}$ ]]
          echo "remote=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "boat=$BOAT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Detect release-version bump
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          for side in Remote Boat; do
            key="${side,,}"
            changed=false
            if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              if ! git diff --quiet "$BEFORE_SHA" HEAD -- "$side/releases/VERSION"; then
                old="$(git show "$BEFORE_SHA:$side/releases/VERSION" | tr -d '\r\n ')"
                new="$(tr -d '\r\n ' < "$side/releases/VERSION")"
                [[ "$old" =~ ^[0-9]{3}$ && "$new" =~ ^[0-9]{3}$ ]]
                [[ $((10#$new)) -eq $((10#$old + 1)) ]] || { echo "::error::$side version must increase by exactly one"; exit 1; }
                changed=true
              fi
            fi
            echo "$key=$changed" >> "$GITHUB_OUTPUT"
          done
      - name: Build archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_VERSION="$(tr -d '\r\n ' < Remote/releases/VERSION)"
          BOAT_VERSION="$(tr -d '\r\n ' < Boat/releases/VERSION)"
          mkdir -p out releases
          # Sorted file lists and normalized timestamps make ZIP bytes reproducible.
          find Remote -type f ! -path 'Remote/releases/*.zip' -print | LC_ALL=C sort > out/remote-files.txt
          find Boat -type f ! -path 'Boat/releases/*.zip' -print | LC_ALL=C sort > out/boat-files.txt
          while IFS= read -r file; do touch -t 198001010000 "$file"; done < out/remote-files.txt
          while IFS= read -r file; do touch -t 198001010000 "$file"; done < out/boat-files.txt
          zip -X -D "out/Flytec_Remote_ver${REMOTE_VERSION}.zip" -@ < out/remote-files.txt
          zip -X -D "out/Flytec_Boat_ver${BOAT_VERSION}.zip" -@ < out/boat-files.txt
          unzip -tq "out/Flytec_Remote_ver${REMOTE_VERSION}.zip"
          unzip -tq "out/Flytec_Boat_ver${BOAT_VERSION}.zip"
          sha256sum out/*.zip | tee "out/SHA256SUMS_ver${REMOTE_VERSION}_${BOAT_VERSION}.txt"
      - name: Package complete Git-tracked project source and SHA-256
        run: |
          python3 tools/flytec.py snapshot --output out/Flytec_Project_PlatformIO_R30H20_source_snapshot.zip
          unzip -tq out/Flytec_Project_PlatformIO_R30H20_source_snapshot.zip
          cd out && sha256sum -c Flytec_Project_PlatformIO_R30H20_source_snapshot.zip.sha256
      - name: Preserve immutable bumped archives (push events only)
        if: github.event_name == 'push' && (steps.release.outputs.remote == 'true' || steps.release.outputs.boat == 'true')
        env:
          REMOTE_BUMP: ${{ steps.release.outputs.remote }}
          BOAT_BUMP: ${{ steps.release.outputs.boat }}
        shell: bash
        run: |
          set -euo pipefail
          # Never attach an archive to a newer source commit by rebasing.
          git fetch origin "$GITHUB_REF_NAME"
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || { echo "::error::Branch moved; release snapshot was not published"; exit 1; }
          for side in Remote Boat; do
            if [[ "$side" == Remote ]]; then bumped="$REMOTE_BUMP"; else bumped="$BOAT_BUMP"; fi
            [[ "$bumped" == true ]] || continue
            version="$(tr -d '\r\n ' < "$side/releases/VERSION")"
            archive="Flytec_${side}_ver${version}.zip"
            dest="$side/releases/$archive"
            [[ ! -e "$dest" ]] || { echo "::error::Existing immutable archive $dest"; exit 1; }
            cp "out/$archive" "$dest"
            cmp "out/$archive" "$dest"
            sha256sum "$dest" > "$side/releases/Flytec_${side}_ver${version}_SHA256.txt"
            sha256sum -c "$side/releases/Flytec_${side}_ver${version}_SHA256.txt"
            git add "$dest" "$side/releases/Flytec_${side}_ver${version}_SHA256.txt"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve immutable Flytec release archives"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Upload full project source snapshot (NOT firmware)
        uses: actions/upload-artifact@v4
        with:
          name: Flytec_Project_PlatformIO_R30H20_source_${{ github.sha }}
          path: |
            out/Flytec_Project_PlatformIO_R30H20_source_snapshot.zip
            out/Flytec_Project_PlatformIO_R30H20_source_snapshot.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload Remote archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flytec_Remote_snapshot_ver${{ steps.version.outputs.remote }}_${{ github.sha }}
          path: out/Flytec_Remote_ver*.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload Boat archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flytec_Boat_snapshot_ver${{ steps.version.outputs.boat }}_${{ github.sha }}
          path: out/Flytec_Boat_ver*.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flytec_ver${{ steps.version.outputs.remote }}_${{ steps.version.outputs.boat }}_SHA256
          path: out/SHA256SUMS_ver*.txt
          if-no-files-found: error
          retention-days: 90
