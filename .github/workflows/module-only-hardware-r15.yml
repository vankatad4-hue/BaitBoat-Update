name: R15 module-only BOM, harness, and fail-closed software gate
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Common/**'
      - 'docs/HARDWARE_MODULE_ONLY_POLICY_R15.md'
      - 'docs/MODULE_ONLY_BOM_R15.csv'
      - 'Boat/docs/BOAT_MODULE_ONLY_*'
      - 'Remote/docs/REMOTE_MODULE_ONLY_*'
      - 'Boat/source/premade_module_output.h'
      - 'Boat/source/ekm014_logical_interface.h'
      - 'Boat/tests/module_only_output_r15_test.cpp'
      - 'Boat/tests/ekm014_logical_interface_r16_test.cpp'
      - 'Boat/tools/ekm014_selection_guard_r16.py'
      - 'Boat/docs/BOAT_EKM014_*'
      - 'Boat/docs/BOAT_PREMADE_SAFETY_STACK_R17.md'
      - 'docs/APPROVED_ELECTRONICS_SUPPLIERS_R18.md'
      - 'docs/VERIFIED_ELECTRONICS_SOURCING_R18.csv'
      - 'Boat/docs/BOAT_DISTRIBUTED_MODULE_INSTALLATION_R18.md'
      - 'Boat/tools/verify_supplier_and_layout_r18.py'
      - 'Boat/docs/BOAT_R17_*'
      - 'docs/MODULE_ONLY_CANDIDATES_R17.csv'
      - 'Boat/tools/verify_premade_safety_stack_r17.py'
      - 'Boat/tools/module_only_policy_r15.py'
      - 'README.md'
      - 'Boat/README.md'
      - 'Remote/README.md'
      - '.github/workflows/boat-kicad-*.yml'
      - '.github/workflows/module-only-hardware-r15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-module-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Stage canonical shared firmware source
        run: python3 Common/stage.py
      - name: Ensure no custom PCB workflows are active and all modules are uncommissioned
        run: python3 Boat/tools/module_only_policy_r15.py
      - name: Compile fail-closed off-the-shelf module request guard
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/module_only_output_r15_test.cpp -o /tmp/module_only_r15
          /tmp/module_only_r15
      - name: Freeze EKM014 41024394 owner-selected four-coil channel mapping
        run: |
          python3 Boat/tools/ekm014_selection_guard_r16.py
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/ekm014_logical_interface_r16_test.cpp -o /tmp/ekm014_r16
          /tmp/ekm014_r16
      - name: R17 verify fail-closed COTS safety shortlist and 21 physical gates
        run: python3 Boat/tools/verify_premade_safety_stack_r17.py
      - name: R18 verify Farnell Bulgaria and trustworthy electronics supplier evidence
        run: python3 Boat/tools/verify_supplier_and_layout_r18.py
      - name: Record scope
        run: |
          echo "### R15 module-only, R16 EKM014, R17 safety candidates and R18 honest Bulgarian sourcing checks PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "No GPIO activated, physical STOP/timer/POR/current-sense modules unselected; no live operation allowed." >> "$GITHUB_STEP_SUMMARY"
