name: Boat R24 host safety and interface gates
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/tools/r22_interface_gate.py'
      - 'Boat/tools/r24_safety_gate.py'
      - 'Boat/tools/r26_pin_budget.py'
      - 'Boat/tools/r30_v2_pin_conflict_gate.py'
      - 'Boat/tools/r32_v2_assignment_solver.py'
      - 'Boat/source/mdd20a_i2c_direction_plan.h'
      - 'Boat/tests/mdd20a_i2c_direction_plan_test.cpp'
      - 'Boat/source/mcp23017_direction_adapter.h'
      - 'Boat/tests/mcp23017_direction_adapter_test.cpp'
      - '.github/workflows/r23-interface-gates.yml'
  pull_request:
    paths:
      - 'Boat/tools/r22_interface_gate.py'
      - 'Boat/tools/r24_safety_gate.py'
      - '.github/workflows/r23-interface-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-interface-and-safety-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q Boat/tools/r22_interface_gate.py Boat/tools/r24_safety_gate.py Boat/tools/r26_pin_budget.py Boat/tools/r30_v2_pin_conflict_gate.py Boat/tools/r32_v2_assignment_solver.py
      - name: Fail-closed GPIO, LoRa and commissioning tests
        run: python -m unittest discover -s Boat/tools -p 'r*_gate.py' -v
      - name: R26 GPIO budget tests
        run: python Boat/tools/r26_pin_budget.py -v
      - name: R30 V2 pin conflict tests
        run: python Boat/tools/r30_v2_pin_conflict_gate.py -v
      - name: R32 V2 allocation budget tests
        run: python Boat/tools/r32_v2_assignment_solver.py -v
      - name: R34 C++ direction-policy tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/mdd20a_i2c_direction_plan_test.cpp -o /tmp/r34_direction_test && /tmp/r34_direction_test
      - name: R35 MCP23017 adapter fault tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/mcp23017_direction_adapter_test.cpp -o /tmp/r35_mcp_test && /tmp/r35_mcp_test
