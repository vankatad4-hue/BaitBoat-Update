name: Boat R24 host safety and interface gates
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/tools/r22_interface_gate.py'
      - 'Boat/tools/r24_safety_gate.py'
      - 'Boat/tools/r26_pin_budget.py'
      - 'Boat/tools/r30_v2_pin_conflict_gate.py'
      - 'Boat/tools/r32_v2_assignment_solver.py'
      - 'Boat/source/mdd20a_i2c_direction_plan.h'
      - 'Boat/tests/mdd20a_i2c_direction_plan_test.cpp'
      - 'Boat/source/mcp23017_direction_adapter.h'
      - 'Boat/tests/mcp23017_direction_adapter_test.cpp'
      - 'Boat/source/hglrc_m100_pro_profile.h'
      - 'Boat/tests/hglrc_m100_pro_profile_test.cpp'
      - 'Boat/source/bmp280_compensation.h'
      - 'Boat/tests/bmp280_compensation_test.cpp'
      - 'Boat/tests/weather_payload_test.cpp'
      - 'Boat/source/compass_calibration_session.h'
      - 'Boat/tests/compass_calibration_session_test.cpp'
      - 'Boat/source/figure8_compass_calibration.h'
      - 'Boat/source/m100_compass_qmc5883l.h'
      - 'Boat/tests/figure8_compass_calibration_test.cpp'
      - 'Boat/source/figure8_auto_session.h'
      - 'Boat/tests/figure8_auto_session_test.cpp'
      - 'Boat/source/figure8_autonomous_motion.h'
      - 'Boat/tests/figure8_autonomous_motion_test.cpp'
      - 'Boat/source/m100_ubx_nav_pvt.h'
      - 'Boat/tests/m100_ubx_nav_pvt_test.cpp'
      - 'Remote/tests/weather_payload_test.cpp'
      - '.github/workflows/r23-interface-gates.yml'
  pull_request:
    paths:
      - 'Boat/tools/r22_interface_gate.py'
      - 'Boat/tools/r24_safety_gate.py'
      - '.github/workflows/r23-interface-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-interface-and-safety-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q Boat/tools/r22_interface_gate.py Boat/tools/r24_safety_gate.py Boat/tools/r26_pin_budget.py Boat/tools/r30_v2_pin_conflict_gate.py Boat/tools/r32_v2_assignment_solver.py
      - name: Fail-closed GPIO, LoRa and commissioning tests
        run: python -m unittest discover -s Boat/tools -p 'r*_gate.py' -v
      - name: R26 GPIO budget tests
        run: python Boat/tools/r26_pin_budget.py -v
      - name: R30 V2 pin conflict tests
        run: python Boat/tools/r30_v2_pin_conflict_gate.py -v
      - name: R32 V2 allocation budget tests
        run: python Boat/tools/r32_v2_assignment_solver.py -v
      - name: R34 C++ direction-policy tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/mdd20a_i2c_direction_plan_test.cpp -o /tmp/r34_direction_test && /tmp/r34_direction_test
      - name: R35 MCP23017 adapter fault tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/mcp23017_direction_adapter_test.cpp -o /tmp/r35_mcp_test && /tmp/r35_mcp_test
      - name: R39 HGLRC GNSS profile tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/hglrc_m100_pro_profile_test.cpp -o /tmp/r39_gps_test && /tmp/r39_gps_test
      - name: R40 Bosch BMP280 compensation tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/bmp280_compensation_test.cpp -o /tmp/r40_bmp280_test && /tmp/r40_bmp280_test
      - name: R40 Boat and Remote weather wire compatibility
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror Boat/source/radio_payload_codec.cpp Boat/source/radio_payload_encoder.cpp Boat/tests/weather_payload_test.cpp -o /tmp/r40_weather_boat && /tmp/r40_weather_boat
          g++ -std=c++17 -Wall -Wextra -Werror Remote/source/radio_payload_codec.cpp Remote/tests/weather_payload_test.cpp -o /tmp/r40_weather_remote && /tmp/r40_weather_remote
      - name: R41 GY-91 compass calibration candidate tests
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/compass_calibration_session_test.cpp -o /tmp/r41_compass_test && /tmp/r41_compass_test
      - name: R42 dual compass figure-eight regression
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/figure8_compass_calibration_test.cpp -o /tmp/r42_fig8 && /tmp/r42_fig8
      - name: R43 automatic dual compass figure-eight completion
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/figure8_auto_session_test.cpp -o /tmp/r43_auto && /tmp/r43_auto
      - name: R44 autonomous figure-eight intent fail-safe regression
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/figure8_autonomous_motion_test.cpp -o /tmp/r44_motion && /tmp/r44_motion
      - name: R45 HGLRC M100 UBX NAV-PVT parser regression
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/m100_ubx_nav_pvt_test.cpp -o /tmp/r45_ubx && /tmp/r45_ubx
      - name: R46 heading-feedback figure-eight safety regression
        run: g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/figure8_closed_loop_test.cpp -o /tmp/r46_figure8 && /tmp/r46_figure8
