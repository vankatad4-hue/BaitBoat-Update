name: Boat portable host tests

on:
  push:
    branches:
      - hardware-ready-dual-radio-r1
    paths:
      - 'Boat/source/**'
      - 'Boat/tools/**'
      - 'Boat/tests/**'
      - 'Boat/docs/BOAT_R25_POWER_LEVEL_EVIDENCE.csv'
      - 'Boat/docs/BOAT_R27_INA231_ACCEPTANCE.csv'
      - 'Boat/docs/BOAT_R27_INA231_HARNESS_OVERRIDE.csv'
      - 'Boat/docs/BOAT_R29_SHARED_3S_BUS_CONNECTIONS.csv'
      - 'Boat/docs/BOAT_R30A_EFFECTIVE_ASSEMBLY_NETS.csv'
      - 'Boat/docs/BOAT_R30A_READINESS_GATES.csv'
      - 'Boat/docs/BOAT_R30A_SOFTWARE_INTEGRATION_MATRIX.csv'
      - 'Boat/docs/BOAT_R30A_PROTOTYPE_ASSEMBLY_HANDOFF.md'
      - 'Boat/docs/BOAT_R30C_ONE_BUS_SAFETY_FEEDBACK_CONTRACT.md'
      - 'Boat/docs/BOAT_R30D_READONLY_FEEDBACK_SIMULATION.md'
      - 'Boat/docs/BOAT_R30E_LOCAL_FAULT_TELEMETRY.md'
      - 'Boat/docs/BOAT_R30F_DIAGNOSTIC_WIRE_PROTOCOL.md'
      - 'Boat/docs/BOAT_R30G_RADIO_DIAGNOSTIC_PRIORITY.md'
      - 'Boat/hardware_test/INA231_Battery_Bench/**'
      - '.github/workflows/boat-host-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Boat/source/**'
      - 'Boat/tools/**'
      - 'Boat/tests/**'
      - 'Boat/docs/BOAT_R25_POWER_LEVEL_EVIDENCE.csv'
      - 'Boat/docs/BOAT_R27_INA231_ACCEPTANCE.csv'
      - 'Boat/docs/BOAT_R27_INA231_HARNESS_OVERRIDE.csv'
      - 'Boat/docs/BOAT_R29_SHARED_3S_BUS_CONNECTIONS.csv'
      - 'Boat/docs/BOAT_R30A_EFFECTIVE_ASSEMBLY_NETS.csv'
      - 'Boat/docs/BOAT_R30A_READINESS_GATES.csv'
      - 'Boat/docs/BOAT_R30A_SOFTWARE_INTEGRATION_MATRIX.csv'
      - 'Boat/docs/BOAT_R30A_PROTOTYPE_ASSEMBLY_HANDOFF.md'
      - 'Boat/docs/BOAT_R30C_ONE_BUS_SAFETY_FEEDBACK_CONTRACT.md'
      - 'Boat/docs/BOAT_R30D_READONLY_FEEDBACK_SIMULATION.md'
      - 'Boat/docs/BOAT_R30E_LOCAL_FAULT_TELEMETRY.md'
      - 'Boat/docs/BOAT_R30F_DIAGNOSTIC_WIRE_PROTOCOL.md'
      - 'Boat/docs/BOAT_R30G_RADIO_DIAGNOSTIC_PRIORITY.md'
      - 'Boat/hardware_test/INA231_Battery_Bench/**'
      - '.github/workflows/boat-host-tests.yml'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: R30H-13 Boat nRF24 stuck-TX host regression (no physical radio)
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -IBoat/tests/r30h13_nrf_stubs -IBoat/source \
            Boat/source/nrf24_link.cpp Boat/tests/r30h13_boat_nrf_timeout_test.cpp \
            -o /tmp/boat_nrf_timeout
          /tmp/boat_nrf_timeout
      - uses: actions/checkout@v4
      - name: Compiler
        run: g++ --version
      - name: Payload encoder/decoder
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            Boat/source/radio_payload_encoder.cpp Boat/source/radio_payload_codec.cpp \
            Boat/tests/radio_payload_encoder_test.cpp -o /tmp/boat_payload_test
          /tmp/boat_payload_test
      - name: Safety, deduplication, cross-radio and 10-second RTH policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/source/boat_radio_safety.cpp Boat/tests/boat_radio_safety_test.cpp \
            -o /tmp/boat_safety_test
          /tmp/boat_safety_test
      - name: Command codec and backup policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/source/radio_command_codec.cpp Boat/tests/radio_command_codec_test.cpp \
            -o /tmp/boat_codec_test
          /tmp/boat_codec_test
      - name: Sequence guard
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/source/radio_command_codec.cpp Boat/tests/radio_sequence_guard_test.cpp \
            -o /tmp/boat_sequence_test
          /tmp/boat_sequence_test
      - name: Fail-closed command policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/source/boat_command_policy.cpp Boat/tests/boat_command_policy_test.cpp \
            -o /tmp/boat_policy_test
          /tmp/boat_policy_test
      - name: Command queue
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/source/boat_command_queue.cpp Boat/tests/boat_command_queue_test.cpp \
            -o /tmp/boat_queue_test
          /tmp/boat_queue_test
      - name: Mission navigation and arrival accuracy gate
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            Boat/source/mission_protocol.cpp Boat/tests/mission_navigation_test.cpp -o /tmp/boat_mission_nav
          /tmp/boat_mission_nav
      - name: Mission execution supervisor simulation
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            Boat/source/mission_protocol.cpp Boat/tests/mission_execution_test.cpp -o /tmp/boat_mission_execution
          /tmp/boat_mission_execution
      - name: Session V2 HMAC and replay bounds
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/radio_session_v2_test.cpp -lcrypto -o /tmp/boat_session_v2
          /tmp/boat_session_v2
      - name: Mutual session handshake, lost confirmation and replay
        run: |
          cmp Remote/source/radio_handshake.h Boat/source/radio_handshake.h
          cmp Remote/source/radio_session_v2.h Boat/source/radio_session_v2.h
          cmp Remote/source/radio_session_platform.h Boat/source/radio_session_platform.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -IBoat/tests/stubs Boat/tests/radio_handshake_test.cpp -lcrypto -o /tmp/boat_handshake
          /tmp/boat_handshake
      - name: Mission execution commands and neutral override simulation
        run: |
          cmp Remote/source/mission_control_wire.h Boat/source/mission_control_wire.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/source/mission_protocol.cpp Boat/tests/mission_controller_test.cpp -o /tmp/boat_mission_controller
          /tmp/boat_mission_controller
      - name: Mission stick receive lease
        run: |
          cmp Remote/source/mission_stick.h Boat/source/mission_stick.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/mission_stick_test.cpp -o /tmp/boat_mission_stick
          /tmp/boat_mission_stick
      - name: Remote and Boat mission command integration simulation
        run: |
          mkdir -p /tmp/flytec_mission_client
          cp Remote/source/mission_control_client.h /tmp/flytec_mission_client/
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I/tmp/flytec_mission_client -IBoat/source Boat/source/mission_protocol.cpp Boat/tests/mission_transport_integration_test.cpp -o /tmp/boat_mission_integration
          /tmp/boat_mission_integration
      - name: R20 MCP23017 EKM014 one-hot output adapter
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/ekm014_mcp23017_adapter_test.cpp -o /tmp/ekm014_mcp_adapter
          /tmp/ekm014_mcp_adapter
      - name: R79 3S battery estimate and mission RTH/critical STOP
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/boat_battery_policy_test.cpp -o /tmp/boat_battery_policy
          /tmp/boat_battery_policy
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/source/mission_protocol.cpp Boat/tests/mission_link_loss_test.cpp -o /tmp/boat_link_loss
          /tmp/boat_link_loss
          mkdir -p /tmp/boat_battery_app
          cp Boat/source/boat_application_port.cpp Boat/source/boat_application_port.h /tmp/boat_battery_app/
          cp Boat/tests/application_stubs/boat_dual_radio_port.h /tmp/boat_battery_app/
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I/tmp/boat_battery_app -IBoat/source -IBoat/tests/stubs /tmp/boat_battery_app/boat_application_port.cpp Boat/tests/boat_application_low_battery_test.cpp -o /tmp/boat_battery_app_test
          /tmp/boat_battery_app_test
      - name: R78 dual-radio STOP, 10-second Home return and recovery
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/source/mission_protocol.cpp Boat/tests/mission_link_loss_test.cpp -o /tmp/boat_link_loss
          /tmp/boat_link_loss
      - name: Trusted hardware samples, motor lease and release executor
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/source/mission_protocol.cpp Boat/tests/boat_hardware_supervisor_test.cpp -o /tmp/boat_hardware_supervisor
          /tmp/boat_hardware_supervisor
      - name: Physical feedback status confirmation
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/boat_hardware_status_test.cpp -o /tmp/boat_hardware_status
          /tmp/boat_hardware_status
      - name: Coherent live telemetry encoding
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/source/radio_payload_encoder.cpp Boat/source/radio_payload_codec.cpp Boat/tests/boat_hardware_telemetry_test.cpp -o /tmp/boat_hardware_telemetry
          /tmp/boat_hardware_telemetry
      - name: Production application bridge with simulated radio and hardware
        run: |
          mkdir -p /tmp/boat_app_test
          cp Boat/source/boat_application_port.cpp Boat/source/boat_application_port.h /tmp/boat_app_test/
          cp Boat/tests/application_stubs/boat_dual_radio_port.h /tmp/boat_app_test/
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I/tmp/boat_app_test -IBoat/source -IBoat/tests/stubs /tmp/boat_app_test/boat_application_port.cpp Boat/tests/boat_application_integration_test.cpp -o /tmp/boat_application
          /tmp/boat_application
      - name: R30H-5 time-source security, monotonic STOP/RTH and replay-isolation
        run: |
          python3 Boat/tools/verify_r30h5_gps_time_isolation.py
          python3 -m unittest Boat/tests/test_r30h5_gps_time_isolation.py -v
      - name: R30H-6 clock quality is NOT common RF clock, marker I/O unsigned
        run: |
          cmp Boat/source/r30h6_utc_marker_policy.h Remote/source/r30h6_utc_marker_policy.h
          cmp Boat/source/radio_utc_time_v1.h Remote/source/radio_utc_time_v1.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -IBoat/source \
            Boat/tests/r30h6_utc_marker_policy_test.cpp -o /tmp/boat_r30h6_utc_marker
          /tmp/boat_r30h6_utc_marker
      - name: R30H-5 GNSS UTC calendar UBX/NMEA parser and authenticated clock discipline (no physical GPS)
        run: |
          cmp Boat/source/radio_utc_time_v1.h Remote/source/radio_utc_time_v1.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            Boat/tests/r30h5_gnss_utc_clock_test.cpp -o /tmp/boat_r30h5_utc
          /tmp/boat_r30h5_utc
      - name: Tracker GNSS and calibrated sensor math
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/tracker_sensors_test.cpp -o /tmp/boat_tracker_sensors
          /tmp/boat_tracker_sensors
      - name: R22 ADS1115 sensor-only bench readout and default-off wiring audit
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/boat_ads1115_bench_math_test.cpp -o /tmp/boat_adc_bench_math
          /tmp/boat_adc_bench_math
          python3 Boat/tools/verify_ads1115_bench_isolation_r22.py
      - name: Carrier motor output and one-hot release planning
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/carrier_output_plan_test.cpp -o /tmp/boat_carrier_output
          /tmp/boat_carrier_output
      - name: Direct MDD20A pin profile fail-closed
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/mdd20a_direct_profile_test.cpp -o /tmp/boat_mdd20a_profile
          /tmp/boat_mdd20a_profile
      - name: Direct MDD20A output gating and fault latching
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/mdd20a_direct_safety_test.cpp -o /tmp/mdd20a_direct_safety
          /tmp/mdd20a_direct_safety
      - name: Hardware GPIO feasibility and conflict budget
        run: |
          python3 Boat/tools/gpio_feasibility_r7.py
          python3 -m unittest discover -s Boat/tests -p test_gpio_feasibility_r7.py -v
      - name: Tracker V1.2 provisional GPIO candidates remain fail-closed
        run: |
          python3 Boat/tools/boat_gpio_candidate_r8.py
          python3 -m unittest discover -s Boat/tests -p test_boat_gpio_candidate_r8.py -v
      - name: MDD20A native KiCad carrier harness net crossover contract
        run: |
          python3 Boat/tools/mdd20a_harness_r8.py
          python3 -m unittest discover -s Boat/tests -p test_mdd20a_harness_r8.py -v
      - name: Independent physical-fault latch and one-hot monostable behavior (simulated)
        run: |
          python3 -m unittest discover -s Boat/tests -p test_safety_gate_latch_r9.py -v
      - name: Ten-input R10 physical STOP latch and default-off gate truth table (simulation)
        run: |
          python3 -m unittest discover -s Boat/tests -p test_safety_cutoff_r10.py -v
      - name: R7 R9 R10 cross-sheet electrical interface contract (standalone checks)
        run: |
          python3 Boat/tools/verify_r7_r9_r10_interfaces.py
      - name: Pack power budget and independent gate failure truth table
        run: |
          python3 -m unittest discover -s Boat/tests -p test_power_and_gate_r7.py -v
      - name: SX1262 airtime and paced-RF fallback regression
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/heltec_sx1262_airtime_test.cpp -o /tmp/boat_sx1262_airtime
          /tmp/boat_sx1262_airtime
      - name: R78 Boat Home NVS record CRC and coordinate validation
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/boat_home_point_record_test.cpp -o /tmp/boat_home_nvs_record
          /tmp/boat_home_nvs_record
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs Boat/source/boat_home_point_nvs.cpp Boat/tests/boat_home_point_nvs_test.cpp -o /tmp/boat_home_nvs_adapter
          /tmp/boat_home_nvs_adapter
      - name: R61 guarded physical driver and calibration storage
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/figure8_calibration_store_test.cpp -o /tmp/r61_cal_store
          /tmp/r61_cal_store
          g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/ekm014_pulse_guard_test.cpp -o /tmp/r61_coil
          /tmp/r61_coil
          g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/boat_physical_driver_adapter_test.cpp -o /tmp/r61_driver_legacy
          /tmp/r61_driver_legacy
          g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/boat_physical_driver_safety_r61_test.cpp -o /tmp/r61_driver_safety
          /tmp/r61_driver_safety
      - name: R61 matching Remote and Boat E22 UART wire contract
        run: python3 -m unittest Boat/tests/test_r61_e22_pair_contract.py -v
      - name: R62 selected Boat endpoint memory contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror Boat/tests/boat_endpoint_memory_gate_r62_test.cpp -o /tmp/r62_memory_gate
          /tmp/r62_memory_gate
      - name: R20 selected ESP32-S3 GPIO/header candidate crosswalk
        run: python3 -m unittest Boat/tests/test_r65_pin_resources.py -v
      - name: R23 verified-header GPIO and modular connection schedule
        run: |
          python3 Boat/tools/verify_gpio_connections_r23.py
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/boat_r23_gpio_contract_test.cpp -o /tmp/boat_r23_gpio
          /tmp/boat_r23_gpio
      - name: R24 shared MCP23017 startup-reset diagnostic output audit
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/boat_r24_mcp_joint_boot_test.cpp -o /tmp/boat_r24_mcp_boot
          /tmp/boat_r24_mcp_boot
      - name: R25 isolated power and logic preflight worksheet stays unsigned
        run: |
          python3 Boat/tools/verify_r25_preflight.py --baseline
          python3 -m unittest Boat/tests/test_r25_preflight.py -v
      - name: R26 INA226 alternative identity and voltage-only safety gate (host only)
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/ina226_candidate_voltage_r26_test.cpp -o /tmp/boat_r26_ina226
          /tmp/boat_r26_ina226
          grep -F 'INA226_HARDWARE_SELECTED = false' Boat/source/ina226_voltage_candidate_r26.h
      - name: R27 selected Ardboard INA231 BUS-only contract, R79 policy and ADS fail-closed
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/ina231_voltage_contract_r27_test.cpp -o /tmp/boat_r27_ina231
          /tmp/boat_r27_ina231
          python3 Boat/tools/verify_r27_battery_selection.py
          grep -F 'INA231_PHYSICAL_COMMISSIONED=false' Boat/source/ina231_voltage_contract_r27.h
          grep -F 'if(boat_r27::INA231_MODULE_SELECTED)' Boat/source/tracker_sensor_port.cpp
          grep -F 'c.battery={false' Boat/source/tracker_sensor_profile.example.h
      - name: R28 INA231 triggered bus, fresh-sample and I2C fault simulations
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror Boat/tests/ina231_acquisition_faults_r28_test.cpp -o /tmp/boat_ina231_r28
          /tmp/boat_ina231_r28
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/r28_stubs Boat/tests/ina231_wire_r28_test.cpp -o /tmp/boat_ina231_wire_r28
          /tmp/boat_ina231_wire_r28
          python3 Boat/tools/verify_r28_prototype_gate.py
      - name: R29 shared 3S bus integrated radio battery actuator and INA231 fault scenarios
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IBoat/tests/stubs \
            Boat/tests/boat_r29_shared_bus_integration_test.cpp \
            -o /tmp/boat_r29_shared_bus
          /tmp/boat_r29_shared_bus
          python3 Boat/tools/verify_r29_shared_bus.py
      - name: R30A effective assembly nets and 24 fail-closed physical readiness gates
        run: |
          python3 Boat/tools/verify_r30a_assembly_package.py
          python3 -m unittest Boat/tests/test_r30a_assembly_package.py -v
      - name: R30B shared 3S brownout and stale INA231 fault simulation
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/tests/boat_r30b_shared_supply_fault_matrix_test.cpp \
            -o /tmp/boat_r30b_faults
          /tmp/boat_r30b_faults
          python3 Boat/tools/verify_r30b_power_fault_lock.py
      - name: R30C one shared 3S STOP watchdog feedback and current-zero fault simulation
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/tests/boat_r30c_common_bus_feedback_test.cpp \
            -o /tmp/boat_r30c_common_bus
          /tmp/boat_r30c_common_bus
          python3 Boat/tools/verify_r30c_common_bus_contract.py
      - name: R30D read-only common 3S input provenance freshness and hardware lock simulations
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/tests/boat_r30d_common_bus_readonly_faults_test.cpp \
            -o /tmp/boat_r30d_readonly
          /tmp/boat_r30d_readonly
          python3 Boat/tools/verify_r30d_readonly_feedback.py
      - name: R30E local diagnostic fault telemetry and change-tracker regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I Boat/tests/stubs \
            Boat/tests/boat_r30e_fault_status_test.cpp -o /tmp/boat_r30e_faults
          /tmp/boat_r30e_faults
          python3 Boat/tools/verify_r30e_fault_status.py
      - name: R30F Boat diagnostic subtype-8 strict wire compatibility
        run: |
          cmp Boat/source/radio_safety_diagnostic_v1.h Remote/source/radio_safety_diagnostic_v1.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -I Boat/source \
            Boat/source/radio_payload_codec.cpp Boat/source/radio_payload_encoder.cpp \
            Boat/tests/r30f_optional_safety_diag_codec_test.cpp -o /tmp/r30f_boat_codec
          /tmp/r30f_boat_codec
          python3 Boat/tools/verify_r30f_diagnostic_protocol.py
      - name: R30G priority scheduling prevents diagnostic starvation of STOP and heartbeat
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror \
            Boat/tests/boat_r30g_optional_diag_budget_test.cpp -o /tmp/r30g_optional
          /tmp/r30g_optional
          python3 Boat/tools/verify_r30g_optional_diag_priority.py
      - name: R30H radio STOP and conditional RTH evidence parser (host-only, unmeasured)
        run: |
          python3 -m unittest Boat/tests/test_r30h_event_analyzer.py -v
          python3 Boat/tools/analyze_r30h_rf_events.py Boat/docs/BOAT_R30H_RF_EVENTS_TEMPLATE.csv > /tmp/r30h_empty.txt || test "$?" -eq 3
          grep -F "NOT_RUN: empty evidence CSV" /tmp/r30h_empty.txt
      - name: R30H-8 PPS dual-ESP shared-clock offset candidate parser (NO PHYSICAL PPS)
        run: |
          python3 -m unittest Boat/tests/test_r30h8_shared_clock.py -v
          python3 Boat/tools/analyze_r30h8_shared_clock.py \
            Boat/docs/BOAT_R30H_8_SHARED_CLOCK_CAPTURE_TEMPLATE.csv \
            Boat/docs/BOAT_R30H_8_SHARED_CLOCK_MANIFEST_TEMPLATE.json \
            > /tmp/r30h8_blank.log || test "$?" -eq 3
          grep -F "R30H-8 NOT_RUN" /tmp/r30h8_blank.log
      - name: R30H-9 Boat/Remote no-GPIO diagnostic marker + hostile unsigned physical probe preflight
        run: |
          cmp Boat/source/r30h9_marker_contract.h Remote/source/r30h9_marker_contract.h
          g++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -IBoat/source \
            Boat/tests/r30h9_marker_contract_test.cpp -o /tmp/boat_r30h9_marker
          /tmp/boat_r30h9_marker
          python3 Boat/tools/verify_r30h9_marker_preflight.py
          python3 -m unittest Boat/tests/test_r30h9_marker_preflight.py -v
      - name: R30H-4 common-clock analyzer and physical evidence provenance (no-RF)
        run: |
          python3 -m unittest Boat/tests/test_r30h4_common_clock_capture.py -v
          python3 Boat/tools/analyze_r30h4_common_clock_capture.py \
            Boat/docs/BOAT_R30H_4_LOGIC_CAPTURE_TEMPLATE.csv \
