name: R30H-118 mock target
on:
  push:
    branches: [platformio-unified-r30h20]
    paths:
      - 'Boat/source/r30h118*'
      - 'Boat/source/r30h120*'
      - 'Boat/source/r30h121*'
      - 'Boat/source/r30h123*'
      - 'Boat/source/boat_r30h18_stop_ack_outbox.h'
      - 'Boat/source/boat_r30h19_status_outbox.h'
      - 'Boat/source/boat_dual_radio_port*'
      - 'Boat/source/boat_neutral_receipt.h'
      - 'Boat/source/mission_neutral_wire.h'
      - 'Boat/source/mission_stick.h'
      - 'Boat/source/radio_protocol.h'
      - 'Boat/source/nrf24_link*'
      - 'Boat/source/e22_uart*'
      - 'Boat/platformio.ini'
      - '.github/workflows/r30h118-mock-build.yml'
  workflow_dispatch:
jobs:
  mock-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Compile only
        run: pio run -d Boat -e boat_r30h118_mock

      - name: Compile dual PHY mock only
        run: pio run -d Boat -e boat_r30h118_dual_mock

      - name: Compile locked physical worker
        run: pio run -d Boat -e boat_r30h120_physical_compile

      - name: Compile full application with dormant endpoints
        run: pio run -d Boat -e boat_r30h121_endpoint_compile

      - name: Compile gated legacy Boat neutral receipt (no upload)
        run: pio run -d Boat -e boat_r30h124w4_neutral_receipt_compile
