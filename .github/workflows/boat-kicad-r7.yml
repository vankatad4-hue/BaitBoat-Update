name: Preliminary MDD20A KiCad schematic check
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/hardware/Direct_MDD20A_R7/**'
      - 'Boat/tests/check_mdd20a_kicad_r7.py'
      - '.github/workflows/boat-kicad-r7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Structural and signal-name checks (not ERC)
        run: python3 Boat/tests/check_mdd20a_kicad_r7.py
      - name: Install KiCad CLI
        run: sudo apt-get update -qq && sudo apt-get install -y kicad
      - name: Parse schematic and export netlist
        working-directory: Boat/hardware/Direct_MDD20A_R7
        run: |
          mkdir -p /tmp/boat-kicad
          kicad-cli sch export netlist --output /tmp/boat-kicad/mdd20a.net Boat_MDD20A_Control_R7.kicad_sch
      - name: Electrical rule check report (warnings allowed while netlist incomplete)
        working-directory: Boat/hardware/Direct_MDD20A_R7
        run: |
          kicad-cli sch erc --output /tmp/boat-kicad/erc.txt Boat_MDD20A_Control_R7.kicad_sch || true
          test -s /tmp/boat-kicad/erc.txt
          echo '==== ERC report (first 100 lines) ===='
          head -n 80 /tmp/boat-kicad/erc.txt
          COUNT=$(grep -c '^\[' /tmp/boat-kicad/erc.txt || true)
          echo "Preliminary KiCad report: $COUNT unresolved ERC violations; NOT ACCEPTED for fabrication"
          echo "### R7 preliminary KiCad: $COUNT unresolved ERC violations — fabrication blocked" >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^\[endpoint_off_grid\]' /tmp/boat-kicad/erc.txt; then echo 'Off-grid geometry is not allowed'; exit 1; fi
          if grep -q '^\[lib_symbol_issues\]' /tmp/boat-kicad/erc.txt; then echo 'Project local symbols are not resolved'; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdd20a-r7-kicad-validation
          path: /tmp/boat-kicad/
          if-no-files-found: ignore
