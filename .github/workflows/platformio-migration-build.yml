name: Primary PlatformIO compile (Boat + Remote, no flashing)

on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/platformio.ini'
      - 'Boat/source/**'
      - 'Remote/platformio.ini'
      - 'Remote/source/**'
      - 'Remote/tools/generate_bg_font.sh'
      - 'Boat/tools/pio_deny_upload.py'
      - 'Boat/tools/verify_r30h10_physical_lock.py'
      - 'Boat/docs/BOAT_R30H_10_PHYSICAL_GATES.csv'
      - 'Boat/docs/BOAT_R30H_10_PIN_MAP.csv'
      - 'Remote/docs/REMOTE_R30H_10_PIN_MAP.csv'
      - 'Boat/tools/verify_r30h10_gpio_map.py'
      - 'Remote/tests/**'
      - 'Boat/tests/**'
      - 'Flytec_V080.code-workspace'
      - 'Remote/tools/pio_deny_upload.py'
      - 'Boat/source/boat_r30h9_marker_config.h'
      - 'Remote/source/remote_r30h9_marker_config.h'
      - '.github/workflows/platformio-migration-build.yml'
  pull_request:
    branches: [main, hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/platformio.ini'
      - 'Boat/source/**'
      - 'Remote/platformio.ini'
      - 'Remote/source/**'
      - 'Remote/tests/**'
      - 'Boat/tests/**'
      - '.github/workflows/platformio-migration-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ${{ matrix.endpoint }} PlatformIO target (primary, no flash)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - endpoint: Boat
            environment: boat_n32r16v_diagnostic
          - endpoint: Remote
            environment: remote_waveshare_43_diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO CLI
        run: python -m pip install 'platformio>=6.1.18,<7'
      - name: Prove safety gates remain locked in source
        run: |
          python Boat/tools/verify_r30h_radio_preflight.py
          python Boat/tools/verify_r30h10_physical_lock.py
          grep -F '#define BOAT_NRF_PIN_AUDIT_SIGNED 0' Boat/source/boat_radio_hw_config.h
          grep -F '#define REMOTE_NRF_PIN_AUDIT_SIGNED 0' Remote/source/radio_hw_config.h
          grep -F '#define BOAT_R30H_LOCAL_TRACE_ENABLED 0' Boat/source/boat_radio_hw_config.h
          grep -F '#define REMOTE_R30H3_STOP_TRACE_ENABLED 0' Remote/source/radio_hw_config.h
          grep -F '#define BOAT_R30H9_MARKER_GPIO (-1)' Boat/source/boat_r30h9_marker_config.h
          grep -F '#define BOAT_R30H9_GPIO_OUTPUT_SIGNED 0' Boat/source/boat_r30h9_marker_config.h
          grep -F '#define REMOTE_R30H9_MARKER_GPIO (-1)' Remote/source/remote_r30h9_marker_config.h
          grep -F '#define REMOTE_R30H9_GPIO_OUTPUT_SIGNED 0' Remote/source/remote_r30h9_marker_config.h
          grep -F '#define REMOTE_SD_DUMMY_CSN_PIN 6' Remote/source/radio_hw_config.h
          grep -F '#define REMOTE_NRF_CE_PIN   (-1)' Remote/source/radio_hw_config.h
          grep -F '#define REMOTE_NRF_CSN_PIN  (-1)' Remote/source/radio_hw_config.h
          python Boat/tools/verify_platformio_source_layout_r30h13.py
          python Boat/tools/verify_r30h10_gpio_map.py
          python -m unittest discover -s Boat/tests -p test_r30h10_gpio_map.py -v
      - name: Cache downloaded PlatformIO packages (not firmware images)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.endpoint }}-${{ hashFiles('Boat/platformio.ini', 'Remote/platformio.ini') }}
      - name: R30H-13 Boat radio stuck-TX watchdog (portable, no RF)
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -IBoat/tests/r30h13_nrf_stubs -IBoat/source \
            Boat/source/nrf24_link.cpp Boat/tests/r30h13_boat_nrf_timeout_test.cpp \
            -o /tmp/boat_nrf_timeout
          /tmp/boat_nrf_timeout
      - name: R30H-17 correlated STOP ACK and status regression
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \\
            Remote/tests/r30h17_stop_confirmation_gate_test.cpp -o /tmp/remote_stop_evidence
          /tmp/remote_stop_evidence
      - name: R30H-15 STOP TX-busy priority regression
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/tests/r30h15_primary_stop_retry_test.cpp -o /tmp/remote_stop_retry
          /tmp/remote_stop_retry
      - name: R30H-12 non-actuating I2C wire-budget regression
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/tests/r30h12_i2c_wire_budget_test.cpp -o /tmp/remote_i2c_budget
          /tmp/remote_i2c_budget
      - name: R30H-11 portable isolated nRF bridge tests before Remote build
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/bridge_stubs -IRemote/source \
            Remote/source/sc18is606_port.cpp Remote/source/mcp23017_ce_port.cpp Remote/source/sc18is606_nrf_link.cpp \
            Remote/tests/sc18is606_bridge_nrf_test.cpp -o /tmp/remote_sc18is606
          /tmp/remote_sc18is606
      - name: Run portable ADS1115 atomic-input test before Remote build
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/adc_stubs -IRemote/source \
            Remote/source/joystick_adc.cpp Remote/tests/joystick_adc_atomic_test.cpp \
            -o /tmp/remote_adc
          /tmp/remote_adc
      - name: Install Node for licensed Bulgarian font (Remote only)
        if: matrix.endpoint == 'Remote'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the same licensed Bulgarian LVGL resource as Arduino CLI
        if: matrix.endpoint == 'Remote'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          bash Remote/tools/generate_bg_font.sh
          cp out/ui-font/flytec_bg_14.c out/ui-font/flytec_bg_14.generated.h Remote/source/
          test -s Remote/source/flytec_bg_14.c
          test -s Remote/source/flytec_bg_14.generated.h
      - name: Build PlatformIO firmware without uploading
        run: |
          set -o pipefail
          pio --version
          pio run -d ${{ matrix.endpoint }} -e ${{ matrix.environment }} \
            2>&1 | tee /tmp/platformio-${{ matrix.endpoint }}.log
      - name: Save primary build log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-${{ matrix.endpoint }}-migration-log
          path: /tmp/platformio-${{ matrix.endpoint }}.log
          if-no-files-found: ignore
