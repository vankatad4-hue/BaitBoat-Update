name: Primary PlatformIO compile (Boat + Remote, no flashing)

on:
  push:
    branches: [hardware-ready-dual-radio-r1, platformio-unified-r30h20]
    paths:
      - 'Boat/platformio.ini'
      - 'Boat/source/**'
      - 'Remote/platformio.ini'
      - 'Remote/source/**'
      - 'Remote/tools/generate_bg_font.sh'
      - 'Boat/tools/pio_deny_upload.py'
      - 'Boat/docs/BOAT_R30H_10_PHYSICAL_GATES.csv'
      - 'Boat/docs/BOAT_R30H_10_PIN_MAP.csv'
      - 'Remote/docs/REMOTE_R30H_10_PIN_MAP.csv'
      - 'Boat/tools/verify_r30h10_gpio_map.py'
      - 'Boat/tools/verify_platformio_source_layout_r30h13.py'
      - 'Boat/tests/test_platformio_source_layout_r30h13.py'
      - 'Remote/tests/**'
      - 'Boat/tests/**'
      - 'Flytec_V080.code-workspace'
      - 'tests/r30h20_**'
      - 'tests/r30h22_**'
      - 'tests/r30h20_stubs/**'
      - 'tools/**'
      - 'Remote/tools/pio_deny_upload.py'
      - 'Boat/source/boat_diagnostic_marker_config.h'
      - 'Remote/source/remote_diagnostic_marker_config.h'
      - '.github/workflows/platformio-migration-build.yml'
  pull_request:
    branches: [main, hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/platformio.ini'
      - 'Boat/source/**'
      - 'Remote/platformio.ini'
      - 'Remote/source/**'
      - 'Remote/tests/**'
      - 'Boat/tests/**'
      - '.github/workflows/platformio-migration-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ${{ matrix.endpoint }} PlatformIO target (primary, no flash)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - endpoint: Boat
            environment: boat_n32r16v_diagnostic
          - endpoint: Remote
            environment: remote_waveshare_43_diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO CLI
        run: python -m pip install 'platformio>=6.1.18,<7'
      - name: Verify build pin configuration and inactive diagnostic defaults
        run: |
          python Boat/tools/verify_r30h_radio_preflight.py
          grep -F '#define BOAT_NRF_PIN_AUDIT_SIGNED 0' Boat/source/boat_radio_hw_config.h
          grep -F '#define REMOTE_NRF_PIN_AUDIT_SIGNED 0' Remote/source/radio_hw_config.h
          grep -F '#define BOAT_R30H_LOCAL_TRACE_ENABLED 0' Boat/source/boat_radio_hw_config.h
          grep -F '#define REMOTE_R30H3_STOP_TRACE_ENABLED 0' Remote/source/radio_hw_config.h
          grep -F '#define BOAT_R30H9_MARKER_GPIO (-1)' Boat/source/boat_diagnostic_marker_config.h
          grep -F '#define BOAT_R30H9_GPIO_OUTPUT_SIGNED 0' Boat/source/boat_diagnostic_marker_config.h
          grep -F '#define REMOTE_R30H9_MARKER_GPIO (-1)' Remote/source/remote_diagnostic_marker_config.h
          grep -F '#define REMOTE_R30H9_GPIO_OUTPUT_SIGNED 0' Remote/source/remote_diagnostic_marker_config.h
          grep -F '#define REMOTE_SD_DUMMY_CSN_PIN 6' Remote/source/radio_hw_config.h
          grep -F '#define REMOTE_NRF_CE_PIN   (-1)' Remote/source/radio_hw_config.h
          grep -F '#define REMOTE_NRF_CSN_PIN  (-1)' Remote/source/radio_hw_config.h
          python Boat/tools/verify_platformio_source_layout_r30h13.py
          python Boat/tools/verify_r30h10_gpio_map.py
          python -m unittest discover -s Boat/tests -p test_r30h10_gpio_map.py -v
      - name: Unified PlatformIO source and VS Code configuration audit
        run: |
          python tools/verify_platformio_unified.py
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: R30H-20 Boat full authenticated 32-byte frames
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Itests/r30h20_stubs -IBoat/source \
            Boat/source/radio_protocol.cpp Boat/source/radio_payload_codec.cpp \
            tests/r30h20_radio_frame_fault_matrix_test.cpp -lcrypto -o /tmp/boat_r30h20
          /tmp/boat_r30h20
      - name: R30H-20 Remote full authenticated 32-byte frames
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Itests/r30h20_stubs -IRemote/source \
            Remote/source/radio_protocol.cpp Remote/source/radio_payload_codec.cpp \
            tests/r30h20_radio_frame_fault_matrix_test.cpp -lcrypto -o /tmp/remote_r30h20
          /tmp/remote_r30h20
      - name: R30H-20 Boat critical battery STATUS wire contract (no hardware)
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IBoat/source \
            Boat/source/radio_payload_codec.cpp \
            Boat/tests/boat_r30h20_battery_status_wire_test.cpp \
            -o /tmp/boat_battery_status_contract
          /tmp/boat_battery_status_contract
      - name: R30H-21 no sequence-budget burn under busy primary radio
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IBoat/source \
            Boat/tests/boat_r30h21_primary_tx_priority_test.cpp \
            -o /tmp/boat_r30h21_budget
          /tmp/boat_r30h21_budget
      - name: R30H-22 real-wire two-endpoint STOP/ACK/STATUS scheduler matrix
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Itests/r30h20_stubs -I${{ matrix.endpoint }}/source \
            ${{ matrix.endpoint }}/source/radio_protocol.cpp \
            ${{ matrix.endpoint }}/source/radio_payload_codec.cpp \
            ${{ matrix.endpoint }}/source/radio_payload_encoder.cpp \
            ${{ matrix.endpoint }}/source/radio_command_codec.cpp \
            Remote/source/radio_ack_tracker.cpp \
            tests/r30h22_dual_stop_scheduler_test.cpp -lcrypto \
            -o /tmp/flytec_r30h22_endpoints
          /tmp/flytec_r30h22_endpoints
      - name: R30H-23 software-only Boat radio-loss RTH battery and output safety matrix
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -IBoat/tests/stubs -IBoat/source \
            Boat/source/mission_protocol.cpp Boat/source/boat_radio_safety.cpp \
            Boat/source/radio_payload_codec.cpp \
            Boat/tests/boat_r30h23_failsafe_integration_test.cpp \
            -o /tmp/boat_r30h23_failsafe
          /tmp/boat_r30h23_failsafe
      - name: R30H-24 Boat supervisor rollover and cached-nav local-input safety
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -IBoat/tests/stubs -IBoat/source \
            Boat/source/mission_protocol.cpp Boat/source/boat_radio_safety.cpp \
            Boat/source/radio_payload_codec.cpp \
            Boat/tests/boat_r30h24_wrap_failsafe_test.cpp \
            -o /tmp/boat_r30h24_wrap
          /tmp/boat_r30h24_wrap
      - name: R30H-24 Boat real application battery alarm single-RTH across wrap
        if: matrix.endpoint == 'Boat'
        run: |
          mkdir -p /tmp/flytec_r30h24_adapter
          cp Boat/source/boat_application_port.cpp Boat/source/boat_application_port.h /tmp/flytec_r30h24_adapter/
          cp Boat/tests/application_stubs/boat_dual_radio_port.h /tmp/flytec_r30h24_adapter/
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I/tmp/flytec_r30h24_adapter -IBoat/source -IBoat/tests/stubs \
            /tmp/flytec_r30h24_adapter/boat_application_port.cpp \
            Boat/tests/boat_r30h24_application_wrap_test.cpp \
            -o /tmp/boat_r30h24_adapter
          /tmp/boat_r30h24_adapter
      - name: R30H-25 Boat application driver failure and session-neutral recovery
        if: matrix.endpoint == 'Boat'
        run: |
          mkdir -p /tmp/flytec_r30h25_adapter
          cp Boat/source/boat_application_port.cpp Boat/source/boat_application_port.h /tmp/flytec_r30h25_adapter/
          cp Boat/tests/application_stubs/boat_dual_radio_port.h /tmp/flytec_r30h25_adapter/
          for t in driver_session_fault brownout_recovery; do
            g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
              -I/tmp/flytec_r30h25_adapter -IBoat/source -IBoat/tests/stubs \
              /tmp/flytec_r30h25_adapter/boat_application_port.cpp \
              Boat/tests/boat_r30h25_${t}_test.cpp -o /tmp/r30h25_${t}
            /tmp/r30h25_${t}
          done
      - name: R30H-26 Boat stuck motor and coil output feedback STOP/UNKNOWN tests
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -IBoat/source Boat/tests/boat_r30h26_output_off_feedback_guard_test.cpp \
            -o /tmp/boat_r30h26_guard
          /tmp/boat_r30h26_guard
          mkdir -p /tmp/flytec_r30h26_adapter
          cp Boat/source/boat_application_port.cpp Boat/source/boat_application_port.h /tmp/flytec_r30h26_adapter/
          cp Boat/tests/application_stubs/boat_dual_radio_port.h /tmp/flytec_r30h26_adapter/
          for t in motor coil; do
            g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
              -I/tmp/flytec_r30h26_adapter -IBoat/source -IBoat/tests/stubs \
              /tmp/flytec_r30h26_adapter/boat_application_port.cpp \
              Boat/tests/boat_r30h26_stuck_${t}_application_test.cpp \
              -o /tmp/boat_r30h26_stuck_${t}
            /tmp/boat_r30h26_stuck_${t}
          done
      - name: Cache downloaded PlatformIO packages (not firmware images)
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.endpoint }}-${{ hashFiles('Boat/platformio.ini', 'Remote/platformio.ini') }}
      - name: R30H-13 Boat radio stuck-TX watchdog (portable, no RF)
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -IBoat/tests/r30h13_nrf_stubs -IBoat/source \
            Boat/source/nrf24_link.cpp Boat/tests/r30h13_boat_nrf_timeout_test.cpp \
            -o /tmp/boat_nrf_timeout
          /tmp/boat_nrf_timeout
      - name: R30H-18 Boat STOP ACK busy-TX bounded outbox (no hardware)
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IBoat/source \
            Boat/tests/boat_r30h18_stop_ack_outbox_test.cpp -o /tmp/boat_r30h18_stop_ack
          /tmp/boat_r30h18_stop_ack
      - name: R30H-19 STOP ACK/status loss and busy-TX integrated host test
        if: matrix.endpoint == 'Boat'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IBoat/source -IRemote/source \
            Boat/source/radio_payload_codec.cpp \
            Boat/tests/boat_r30h19_stop_ack_status_integration_test.cpp \
            -o /tmp/boat_r30h19_flow
          /tmp/boat_r30h19_flow
      - name: R30H-19 Remote real STOP ACK wire/tracker/STATUS gate (host only)
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/source/radio_payload_codec.cpp Remote/source/radio_payload_encoder.cpp \
            Remote/source/radio_ack_tracker.cpp Remote/tests/r30h19_ack_wire_test.cpp -o /tmp/remote_r30h19_wire
          /tmp/remote_r30h19_wire
      - name: R30H-17 correlated STOP ACK and status regression
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/tests/r30h17_stop_confirmation_gate_test.cpp -o /tmp/remote_stop_evidence
          /tmp/remote_stop_evidence
      - name: R30H-15 STOP TX-busy priority regression
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/tests/r30h15_primary_stop_retry_test.cpp -o /tmp/remote_stop_retry
          /tmp/remote_stop_retry
      - name: R30H-12 non-actuating I2C wire-budget regression
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/source \
            Remote/tests/r30h12_i2c_wire_budget_test.cpp -o /tmp/remote_i2c_budget
          /tmp/remote_i2c_budget
      - name: R30H-11 portable isolated nRF bridge tests before Remote build
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/bridge_stubs -IRemote/source \
            Remote/source/sc18is606_port.cpp Remote/source/mcp23017_ce_port.cpp Remote/source/sc18is606_nrf_link.cpp \
            Remote/tests/sc18is606_bridge_nrf_test.cpp -o /tmp/remote_sc18is606
          /tmp/remote_sc18is606
      - name: Run portable ADS1115 atomic-input test before Remote build
        if: matrix.endpoint == 'Remote'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -IRemote/tests/adc_stubs -IRemote/tests/stubs -IRemote/source \
            Remote/source/joystick_adc.cpp Remote/tests/joystick_adc_atomic_test.cpp \
            -o /tmp/remote_adc
          /tmp/remote_adc
      - name: Install Node for licensed Bulgarian font (Remote only)
        if: matrix.endpoint == 'Remote'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the same licensed Bulgarian LVGL resource as Arduino CLI
        if: matrix.endpoint == 'Remote'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          bash Remote/tools/generate_bg_font.sh
          cp out/ui-font/flytec_bg_14.c out/ui-font/flytec_bg_14.generated.h Remote/source/
          test -s Remote/source/flytec_bg_14.c
          test -s Remote/source/flytec_bg_14.generated.h
      - name: Build PlatformIO firmware without uploading
        run: |
          set -o pipefail
          pio --version
          pio run -d ${{ matrix.endpoint }} -e ${{ matrix.environment }} \
            2>&1 | tee /tmp/platformio-${{ matrix.endpoint }}.log
      - name: Save primary build log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platformio-${{ matrix.endpoint }}-migration-log
          path: /tmp/platformio-${{ matrix.endpoint }}.log
          if-no-files-found: ignore
