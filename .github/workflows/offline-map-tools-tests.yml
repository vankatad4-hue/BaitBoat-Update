name: Offline Map Tool Tests
on:
  push:
    branches: [hardware-ready-dual-radio-r1, platformio-unified-r30h20]
    paths:
      - "Remote/tools/**"
      - ".github/workflows/offline-map-tools-tests.yml"
  pull_request:
    paths:
      - "Remote/tools/**"
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip Pillow
      - run: python -m unittest discover -s Remote/tools/tests -v
