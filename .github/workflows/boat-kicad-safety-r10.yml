name: R10 physical STOP and high-side candidate KiCad
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Boat/hardware/Safety_Cutoff_R10/**'
      - 'Boat/tests/verify_safety_cutoff_netlist_r10.py'
      - '.github/workflows/boat-kicad-safety-r10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  netlist-and-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reject assigned footprints and false fabrication status
        run: python3 Boat/tests/verify_safety_cutoff_netlist_r10.py
      - name: Install KiCad CLI
        run: sudo apt-get update -qq && sudo apt-get install -y kicad
      - name: Export actual native KiCad XML netlist
        run: |
          mkdir -p /tmp/boat-r10
          kicad-cli sch export netlist --format kicadxml --output /tmp/boat-r10/safety.xml Boat/hardware/Safety_Cutoff_R10/Boat_Safety_Cutoff_R10.kicad_sch
      - name: Exact high-side source drain gate and ten-signal latch tests
        run: python3 Boat/tests/verify_safety_cutoff_netlist_r10.py --xml /tmp/boat-r10/safety.xml
      - name: Standalone ERC cannot certify independent safety
        run: |
          kicad-cli sch erc --output /tmp/boat-r10/erc.txt Boat/hardware/Safety_Cutoff_R10/Boat_Safety_Cutoff_R10.kicad_sch
          test -s /tmp/boat-r10/erc.txt
          echo "### R10 standalone draft structural/ERC PASS; **not fabrication or electrical safety approval**" >> "$GITHUB_STEP_SUMMARY"
          echo "Not implemented: real UVLO/OCP/thermal/physical ARM debounce, actual part ratings, R7 integration, physical cutoff/loads." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload schematic netlist and ERC
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boat-r10-candidate-kicad
          path: /tmp/boat-r10/
          if-no-files-found: ignore
