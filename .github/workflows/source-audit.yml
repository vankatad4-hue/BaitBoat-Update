name: Boat/Remote conservative source inventory (read-only)
on:
  push:
    branches: [hardware-ready-dual-radio-r1, platformio-unified-r30h20]
    paths:
      - 'Boat/source/**'
      - 'Remote/source/**'
      - 'Boat/platformio.ini'
      - 'Remote/platformio.ini'
      - 'Remote/archive/2026-11-23/R30H_13_direct_RF24/**'
      - 'Boat/tools/verify_platformio_source_layout_r30h13.py'
      - 'Boat/tests/test_r30h27_feedback_matrix.py'
      - 'Boat/tests/test_platformio_source_layout_r30h13.py'
      - 'Flytec_V080.code-workspace'
      - 'tests/r30h20_**'
      - 'tests/r30h20_stubs/**'
      - 'tools/**'
      - '.github/workflows/boat-target-build.yml'
      - 'Boat/tools/audit_source_inventory_r30h10.py'
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unified PlatformIO workspace and no-upload gates
        run: |
          python3 tools/verify_platformio_unified.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Read-only active/legacy include graph and compile guards
        run: python3 Boat/tools/audit_source_inventory_r30h10.py --json /tmp/source-audit.json
      - name: Validate every active Boat/Remote source and shared protocol pair
        run: |
          python3 Boat/tools/verify_platformio_source_layout_r30h13.py --json /tmp/platformio-audit.json
          python3 -m unittest discover -s Boat/tests -p test_platformio_source_layout_r30h13.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: flytec-source-inventory-not-physical-acceptance
          path: |
            /tmp/source-audit.json
            /tmp/platformio-audit.json
          if-no-files-found: error
