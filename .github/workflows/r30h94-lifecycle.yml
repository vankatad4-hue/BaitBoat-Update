name: R30H-94 dual-core lifecycle host
on:
  push:
    paths:
      - '**/source/dual_core_diagnostic.h'
      - '**/source/radio_worker.h'
      - '**/source/radio_watchdog.h'
      - 'Boat/tests/r30h96_watchdog.cpp'
      - '**/source/radio_frame_handoff.h'
      - 'Boat/tests/r30h99_frame_handoff.cpp'
      - '**/source/bounded_tx_service.h'
      - '**/source/bounded_rx_service.h'
      - '**/source/tx_generation_gate.h'
      - '**/source/nrf_phy_adapter.h'
      - '**/source/e22_tx_state.h'
      - '**/source/e22_phy_adapter.h'
      - '**/source/dual_phy_poll.h'
      - '**/source/dual_phy_worker.h'
      - 'Remote/source/remote_i2c_owner.h'
      - 'Remote/source/remote_i2c_dispatcher.h'
      - 'Remote/source/remote_i2c_phy_service.h'
      - 'Remote/tests/r30h111_i2c_dispatcher.cpp'
      - 'Remote/tests/stubs/freertos/**'
      - 'Boat/tests/r30h110_i2c_owner.cpp'
      - 'Boat/tests/r30h109_dual_phy.cpp'
      - 'Boat/tests/r30h108_e22_adapter.cpp'
      - 'Boat/tests/r30h107_e22_state.cpp'
      - 'Boat/tests/r30h106_nrf_adapter.cpp'
      - 'Boat/tests/r30h103_generation.cpp'
      - 'Boat/tests/r30h101_tx_service.cpp'
      - 'Boat/tests/r30h98_i2c_guard.cpp'
      - 'Remote/source/i2c_bus_guard.h'
      - 'Boat/tests/r30h95_radio_worker.cpp'
      - 'Boat/tests/r30h94*'
      - 'Boat/tests/r30h94_mock/**'
      - '.github/workflows/r30h94-lifecycle.yml'
  workflow_dispatch:
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmp Boat/source/dual_core_diagnostic.h Remote/source/dual_core_diagnostic.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/source Boat/tests/r30h94_lifecycle.cpp -o /tmp/lifecycle
          timeout 30s /tmp/lifecycle
          cmp Boat/source/radio_worker.h Remote/source/radio_worker.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/source Boat/tests/r30h95_radio_worker.cpp -o /tmp/radio_worker
          timeout 30s /tmp/radio_worker
          cmp Boat/source/radio_watchdog.h Remote/source/radio_watchdog.h
          g++ -std=c++17 -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h96_watchdog.cpp -o /tmp/watchdog
          /tmp/watchdog
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h73_freertos_mock -IRemote/source Boat/tests/r30h98_i2c_guard.cpp -o /tmp/i2c_guard
          timeout 10s /tmp/i2c_guard
          cmp Boat/source/radio_frame_handoff.h Remote/source/radio_frame_handoff.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h99_frame_handoff.cpp -o /tmp/frame_handoff
          timeout 10s /tmp/frame_handoff
          cmp Boat/source/bounded_rx_service.h Remote/source/bounded_rx_service.h
          cmp Boat/source/bounded_tx_service.h Remote/source/bounded_tx_service.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h101_tx_service.cpp -o /tmp/tx_service
          timeout 10s /tmp/tx_service
          cmp Boat/source/tx_generation_gate.h Remote/source/tx_generation_gate.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h103_generation.cpp -o /tmp/generation
          timeout 10s /tmp/generation
          cmp Boat/source/nrf_phy_adapter.h Remote/source/nrf_phy_adapter.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h106_nrf_adapter.cpp -o /tmp/nrf_adapter
          timeout 10s /tmp/nrf_adapter
          cmp Boat/source/e22_tx_state.h Remote/source/e22_tx_state.h
          g++ -std=c++17 -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h107_e22_state.cpp -o /tmp/e22_state
          /tmp/e22_state
          cmp Boat/source/e22_phy_adapter.h Remote/source/e22_phy_adapter.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h108_e22_adapter.cpp -o /tmp/e22_adapter
          timeout 10s /tmp/e22_adapter
          cmp Boat/source/dual_phy_poll.h Remote/source/dual_phy_poll.h
          cmp Boat/source/dual_phy_worker.h Remote/source/dual_phy_worker.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h109_dual_phy.cpp -o /tmp/dual_phy
          timeout 10s /tmp/dual_phy
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/source Boat/tests/r30h110_i2c_owner.cpp -o /tmp/i2c_owner
          timeout 10s /tmp/i2c_owner
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h111_i2c_dispatcher.cpp -o /tmp/i2c_dispatcher
          timeout 10s /tmp/i2c_dispatcher
