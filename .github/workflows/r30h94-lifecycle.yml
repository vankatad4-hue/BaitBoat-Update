name: R30H-94 dual-core lifecycle host
on:
  push:
    paths:
      - '**/source/dual_core_diagnostic.h'
      - '**/source/radio_worker.h'
      - '**/source/radio_watchdog.h'
      - 'Boat/tests/r30h96_watchdog.cpp'
      - '**/source/radio_frame_handoff.h'
      - 'Boat/tests/r30h99_frame_handoff.cpp'
      - '**/source/bounded_tx_service.h'
      - '**/source/bounded_rx_service.h'
      - '**/source/tx_generation_gate.h'
      - '**/source/nrf_phy_adapter.h'
      - '**/source/e22_tx_state.h'
      - '**/source/e22_phy_adapter.h'
      - '**/source/dual_phy_poll.h'
      - '**/source/dual_phy_worker.h'
      - 'Remote/source/remote_i2c_owner.h'
      - 'Remote/source/remote_i2c_dispatcher.h'
      - 'Remote/source/radio_latency_stats.h'
      - 'Remote/tests/r30h116_latency.cpp'
      - 'Remote/source/remote_i2c_phy_service.h'
      - 'Remote/source/remote_i2c_request_scheduler.h'
      - 'Remote/source/remote_worker_runtime.h'
      - 'Remote/source/remote_exclusive_runtime.h'
      - 'Remote/source/remote_authenticated_mock_app.h'
      - 'Boat/source/boat_session_recovery.h'
      - 'Boat/source/boat_handshake_reply.h'
      - 'Boat/source/r30h118_spsc_queue.h'
      - 'Boat/source/r30h118_transport.h'
      - 'Boat/source/r30h120_handshake_lane.h'
      - 'Boat/source/r30h123_owner_link.h'
      - 'Boat/tests/r30h124m_handshake_cancel.cpp'
      - 'Boat/tests/r30h124n_backup_handshake.cpp'
      - 'Boat/source/radio_handshake.h'
      - 'Remote/source/radio_handshake.h'
      - 'Boat/tests/r30h124l_handshake_reply.cpp'
      - 'Boat/tests/r30h124k_session_recovery.cpp'
      - 'Remote/source/remote_mock_peer.h'
      - 'Remote/tests/r30h124j_authenticated_mock.cpp'
      - 'Remote/tests/r30h124i_exclusive_runtime.cpp'
      - 'Remote/tests/r30h124_runtime.cpp'
      - 'Remote/source/remote_async_tx.h'
      - 'Remote/source/remote_tx_router.h'
      - 'Remote/source/remote_ordinary_intent.h'
      - 'Remote/source/remote_async_ordinary.h'
      - 'Remote/source/remote_clear_gate.h'
      - 'Remote/source/radio_ack_tracker.cpp'
      - 'Remote/tests/r30h124r_ack_deadline.cpp'
      - 'Remote/source/remote_async_mission_upload.h'
      - 'Remote/source/mission_protocol.h'
      - 'Remote/source/mission_protocol.cpp'
      - 'Remote/tests/r30h124s_mission_upload.cpp'
      - 'Remote/tests/r30h124q_clear_gate.cpp'
      - 'Remote/tests/r30h124q_authenticated_ordinary.cpp'
      - 'Remote/tests/r30h124p_ordinary_intent.cpp'
      - 'Remote/tests/r30h124p_ordinary_producer.cpp'
      - 'Remote/tests/r30h124o_tx_router.cpp'
      - 'Remote/tests/r30h124f_async_tx.cpp'
      - 'Remote/source/remote_async_control.h'
      - 'Remote/source/remote_async_handshake.h'
      - 'Remote/tests/r30h124h_async_handshake.cpp'
      - 'Remote/tests/r30h124g_async_control.cpp'
      - 'Remote/tests/r30h113_i2c_scheduler.cpp'
      - 'Remote/tests/r30h115_integrated_phy.cpp'
      - 'Remote/tests/r30h111_i2c_dispatcher.cpp'
      - 'Remote/tests/stubs/freertos/**'
      - 'Boat/tests/r30h110_i2c_owner.cpp'
      - 'Boat/tests/r30h109_dual_phy.cpp'
      - 'Boat/tests/r30h108_e22_adapter.cpp'
      - 'Boat/tests/r30h107_e22_state.cpp'
      - 'Boat/tests/r30h106_nrf_adapter.cpp'
      - 'Boat/tests/r30h103_generation.cpp'
      - 'Boat/tests/r30h101_tx_service.cpp'
      - 'Boat/tests/r30h98_i2c_guard.cpp'
      - 'Remote/source/i2c_bus_guard.h'
      - 'Boat/tests/r30h95_radio_worker.cpp'
      - 'Boat/tests/r30h94*'
      - 'Boat/tests/r30h94_mock/**'
      - '.github/workflows/r30h94-lifecycle.yml'
  workflow_dispatch:
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmp Boat/source/dual_core_diagnostic.h Remote/source/dual_core_diagnostic.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/source Boat/tests/r30h94_lifecycle.cpp -o /tmp/lifecycle
          timeout 30s /tmp/lifecycle
          cmp Boat/source/radio_worker.h Remote/source/radio_worker.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/source Boat/tests/r30h95_radio_worker.cpp -o /tmp/radio_worker
          timeout 30s /tmp/radio_worker
          cmp Boat/source/radio_watchdog.h Remote/source/radio_watchdog.h
          g++ -std=c++17 -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h96_watchdog.cpp -o /tmp/watchdog
          /tmp/watchdog
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h73_freertos_mock -IRemote/source Boat/tests/r30h98_i2c_guard.cpp -o /tmp/i2c_guard
          timeout 10s /tmp/i2c_guard
          cmp Boat/source/radio_frame_handoff.h Remote/source/radio_frame_handoff.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h99_frame_handoff.cpp -o /tmp/frame_handoff
          timeout 10s /tmp/frame_handoff
          cmp Boat/source/bounded_rx_service.h Remote/source/bounded_rx_service.h
          cmp Boat/source/bounded_tx_service.h Remote/source/bounded_tx_service.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h101_tx_service.cpp -o /tmp/tx_service
          timeout 10s /tmp/tx_service
          cmp Boat/source/tx_generation_gate.h Remote/source/tx_generation_gate.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h103_generation.cpp -o /tmp/generation
          timeout 10s /tmp/generation
          cmp Boat/source/nrf_phy_adapter.h Remote/source/nrf_phy_adapter.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h106_nrf_adapter.cpp -o /tmp/nrf_adapter
          timeout 10s /tmp/nrf_adapter
          cmp Boat/source/e22_tx_state.h Remote/source/e22_tx_state.h
          g++ -std=c++17 -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h107_e22_state.cpp -o /tmp/e22_state
          /tmp/e22_state
          cmp Boat/source/e22_phy_adapter.h Remote/source/e22_phy_adapter.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h108_e22_adapter.cpp -o /tmp/e22_adapter
          timeout 10s /tmp/e22_adapter
          cmp Boat/source/dual_phy_poll.h Remote/source/dual_phy_poll.h
          cmp Boat/source/dual_phy_worker.h Remote/source/dual_phy_worker.h
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IBoat/tests/r30h94_mock -IBoat/tests/r30h73_freertos_mock -IBoat/source Boat/tests/r30h109_dual_phy.cpp -o /tmp/dual_phy
          timeout 10s /tmp/dual_phy
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/source Boat/tests/r30h110_i2c_owner.cpp -o /tmp/i2c_owner
          timeout 10s /tmp/i2c_owner
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h111_i2c_dispatcher.cpp -o /tmp/i2c_dispatcher
          timeout 10s /tmp/i2c_dispatcher
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h113_i2c_scheduler.cpp -o /tmp/i2c_scheduler
          timeout 10s /tmp/i2c_scheduler
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h115_integrated_phy.cpp -o /tmp/integrated_phy
          timeout 10s /tmp/integrated_phy
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h116_latency.cpp -o /tmp/radio_latency
          timeout 10s /tmp/radio_latency
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h124_runtime.cpp -o /tmp/remote_runtime
          timeout 10s /tmp/remote_runtime

          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h124f_async_tx.cpp -o /tmp/remote_async_tx
          timeout 10s /tmp/remote_async_tx

          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -Itests/r30h20_stubs -IRemote/source Remote/source/radio_protocol.cpp Remote/source/radio_command_codec.cpp Remote/tests/r30h124g_async_control.cpp -lcrypto -o /tmp/remote_async_control
          timeout 10s /tmp/remote_async_control

          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -Itests/r30h20_stubs -IRemote/source Remote/source/radio_protocol.cpp Remote/source/radio_command_codec.cpp Remote/tests/r30h124h_async_handshake.cpp -lcrypto -o /tmp/remote_async_handshake
          timeout 10s /tmp/remote_async_handshake

          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -IRemote/source Remote/tests/r30h124i_exclusive_runtime.cpp -o /tmp/remote_exclusive_runtime
          timeout 10s /tmp/remote_exclusive_runtime

          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -Itests/r30h20_stubs -IRemote/source Remote/source/radio_protocol.cpp Remote/source/radio_command_codec.cpp Remote/source/radio_payload_codec.cpp Remote/source/radio_ack_tracker.cpp Remote/tests/r30h124j_authenticated_mock.cpp -lcrypto -o /tmp/remote_authenticated_mock
          timeout 10s /tmp/remote_authenticated_mock

          g++ -std=c++17 -Wall -Wextra -Werror -Itests/r30h20_stubs -IBoat/source Boat/tests/r30h124k_session_recovery.cpp -lcrypto -o /tmp/boat_session_recovery
          timeout 10s /tmp/boat_session_recovery

          g++ -std=c++17 -Wall -Wextra -Werror -Itests/r30h20_stubs -IBoat/source Boat/tests/r30h124l_handshake_reply.cpp -o /tmp/boat_handshake_reply
          timeout 10s /tmp/boat_handshake_reply

          g++ -std=c++17 -Wall -Wextra -Werror -IBoat/source Boat/tests/r30h124m_handshake_cancel.cpp -o /tmp/boat_handshake_cancel
          timeout 10s /tmp/boat_handshake_cancel

          g++ -std=c++17 -Wall -Wextra -Werror -Itests/r30h20_stubs -IBoat/source Boat/tests/r30h124n_backup_handshake.cpp -lcrypto -o /tmp/backup_handshake
          timeout 10s /tmp/backup_handshake

          g++ -std=c++17 -Wall -Wextra -Werror -IRemote/source Remote/tests/r30h124o_tx_router.cpp -o /tmp/remote_tx_router
          timeout 10s /tmp/remote_tx_router

          g++ -std=c++17 -Wall -Wextra -Werror -Itests/r30h20_stubs -IRemote/source Remote/tests/r30h124p_ordinary_intent.cpp -o /tmp/ordinary_intent
          timeout 10s /tmp/ordinary_intent
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/r30h20_stubs -IRemote/source Remote/tests/r30h124p_ordinary_producer.cpp -o /tmp/ordinary_producer
          timeout 10s /tmp/ordinary_producer

          g++ -std=c++17 -Wall -Wextra -Werror -IRemote/source Remote/tests/r30h124q_clear_gate.cpp -o /tmp/remote_clear_gate
          timeout 10s /tmp/remote_clear_gate
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -IRemote/tests/stubs -IBoat/tests/r30h73_freertos_mock -Itests/r30h20_stubs -IRemote/source Remote/source/radio_protocol.cpp Remote/source/radio_command_codec.cpp Remote/source/radio_payload_codec.cpp Remote/source/radio_ack_tracker.cpp Remote/tests/r30h124q_authenticated_ordinary.cpp -lcrypto -o /tmp/remote_authenticated_ordinary
          timeout 10s /tmp/remote_authenticated_ordinary

          g++ -std=c++17 -Wall -Wextra -Werror -IRemote/source Remote/source/radio_ack_tracker.cpp Remote/tests/r30h124r_ack_deadline.cpp -o /tmp/ack_deadline
          timeout 10s /tmp/ack_deadline

          g++ -std=c++17 -Wall -Wextra -Werror -IRemote/source Remote/source/mission_protocol.cpp Remote/tests/r30h124s_mission_upload.cpp -o /tmp/async_mission_upload
          timeout 10s /tmp/async_mission_upload
