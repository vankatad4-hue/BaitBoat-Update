name: Boat target compile — ESP32-S3 diagnostic only
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Common/**'
      - 'Boat/source/**'
      - 'Boat/hardware_test/ADS1115_Battery_Bench/**'
      - 'Boat/hardware_test/INA231_Battery_Bench/**'
      - '.github/workflows/boat-target-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-target-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage canonical shared firmware source
        run: python3 Common/stage.py
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned ESP32 and radio dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli lib update-index
          arduino-cli core install esp32:esp32@3.0.2
          arduino-cli lib install "RF24@1.4.11"
      - name: Stage diagnostic application
        run: |
          mkdir -p /tmp/FlytecBoatBuild
          cp Boat/source/*.cpp Boat/source/*.h /tmp/FlytecBoatBuild/
          cp Boat/source/firmware/Flytec_Boat.ino /tmp/FlytecBoatBuild/FlytecBoatBuild.ino
      - name: Compile Boat diagnostic (N32R16V 32MB octal flash, 16MB octal PSRAM; no actuation)
        run: |
          set -o pipefail
          # Espressif core 3.0.2 selects a missing 32MB default partition CSV;
          # pin the existing diagnostic-only huge_app table (no OTA) explicitly.
          # A reviewed 32MB dual-OTA partition layout is still required before OTA.
          arduino-cli compile --verbose --export-binaries --fqbn 'esp32:esp32:esp32s3:FlashSize=32M,FlashMode=opi,PSRAM=opi,PartitionScheme=huge_app' /tmp/FlytecBoatBuild 2>&1 | tee /tmp/boat-target-build.log
      - name: R30H-2 compile optional USB-only local trace (no RF or actuators)
        run: |
          set -euo pipefail
          mkdir -p /tmp/FlytecBoatR30H2Trace
          cp Boat/source/*.cpp Boat/source/*.h /tmp/FlytecBoatR30H2Trace/
          cp Boat/source/firmware/Flytec_Boat.ino /tmp/FlytecBoatR30H2Trace/FlytecBoatR30H2Trace.ino
          sed -i 's/#define BOAT_R30H_LOCAL_TRACE_ENABLED 0/#define BOAT_R30H_LOCAL_TRACE_ENABLED 1/' /tmp/FlytecBoatR30H2Trace/boat_radio_hw_config.h
          grep -F '#define BOAT_NRF_PIN_AUDIT_SIGNED 0' /tmp/FlytecBoatR30H2Trace/boat_radio_hw_config.h
          grep -F '#define BOAT_E22_UART_RF_INTEROPERABILITY_VERIFIED 0' /tmp/FlytecBoatR30H2Trace/boat_radio_hw_config.h
          grep -F '#define BOAT_E22_RF_AIRTIME_AUDIT_SIGNED 0' /tmp/FlytecBoatR30H2Trace/boat_radio_hw_config.h
          grep -F '#define BOAT_R30H_LOCAL_TRACE_ENABLED 1' /tmp/FlytecBoatR30H2Trace/boat_radio_hw_config.h
          set -o pipefail
          # Compile proof only. Never upload this diagnostic variant as an official release.
          arduino-cli compile --verbose --fqbn 'esp32:esp32:esp32s3:FlashSize=32M,FlashMode=opi,PSRAM=opi,PartitionScheme=huge_app' /tmp/FlytecBoatR30H2Trace 2>&1 | tee /tmp/boat-r30h2-usb-trace-compile.log
      - name: R30H-2 optional trace compiler log (no firmware artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-r30h2-usb-only-build-log
          path: /tmp/boat-r30h2-usb-trace-compile.log
          if-no-files-found: ignore
      - name: Stage R22 ADS1115 bench firmware (locked and non-actuating by default)
        run: |
          mkdir -p /tmp/BoatAdcBench
          cp Boat/hardware_test/ADS1115_Battery_Bench/ADS1115_Battery_Bench.ino /tmp/BoatAdcBench/BoatAdcBench.ino
          cp Boat/source/boat_battery_divider.h Boat/source/boat_ads1115_bench_math.h /tmp/BoatAdcBench/
          # NO locally signed pin config is staged. The resulting binary is locked.
      - name: Compile R22 ADC-only bench target (no actuator or radio dependencies)
        run: |
          set -o pipefail
          arduino-cli compile --verbose --export-binaries --fqbn 'esp32:esp32:esp32s3:FlashSize=32M,FlashMode=opi,PSRAM=opi,PartitionScheme=huge_app' /tmp/BoatAdcBench 2>&1 | tee /tmp/boat-adc-bench-target-build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flytec-boat-r22-ads1115-bench-LOCKED
          path: /tmp/BoatAdcBench/build/esp32.esp32.esp32s3/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boat-r22-ads1115-target-build-log
          path: /tmp/boat-adc-bench-target-build.log
          if-no-files-found: ignore
      - name: Stage R30A INA231-only bench (strictly locked; no actuator or radio API)
        run: |
          mkdir -p /tmp/BoatInaBench
          cp Boat/hardware_test/INA231_Battery_Bench/INA231_Battery_Bench.ino /tmp/BoatInaBench/BoatInaBench.ino
          cp Boat/source/ina231_voltage_contract.h Boat/source/ina231_acquisition.h Boat/source/ina231_arduino_wire.h /tmp/BoatInaBench/
          # No locally signed bench profile is staged. Default sketch never touches Wire pins.
      - name: Compile selected R30A INA231-only locked target
        run: |
          set -o pipefail
          arduino-cli compile --verbose --export-binaries --fqbn 'esp32:esp32:esp32s3:FlashSize=32M,FlashMode=opi,PSRAM=opi,PartitionScheme=huge_app' /tmp/BoatInaBench 2>&1 | tee /tmp/boat-ina231-r30a-target-build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flytec-boat-r30a-ina231-bench-LOCKED
          path: /tmp/BoatInaBench/build/esp32.esp32.esp32s3/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boat-r30a-ina231-target-build-log
          path: /tmp/boat-ina231-r30a-target-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flytec-boat-diagnostic-firmware
          path: /tmp/FlytecBoatBuild/build/esp32.esp32.esp32s3/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boat-target-build-log
          path: /tmp/boat-target-build.log
          if-no-files-found: ignore
