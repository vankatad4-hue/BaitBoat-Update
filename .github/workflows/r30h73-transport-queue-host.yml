name: R30H-73 transport queue host stress
on:
  push:
    branches: [platformio-unified-r30h20]
    paths:
      - 'Boat/source/transport_task_queue.h'
      - 'Remote/source/transport_task_queue.h'
      - 'Boat/tests/r30h73*'
      - 'Boat/tests/run_r30h73_transport_queue_host.sh'
      - 'Boat/tests/test_r30h71_transport_handoff_contract.py'
      - 'Boat/tests/test_r30h87_dual_core_contract.py'
      - 'Boat/source/dual_core_diagnostic.h'
      - 'Remote/source/dual_core_diagnostic.h'
      - '.github/workflows/r30h73-transport-queue-host.yml'
  workflow_dispatch:
jobs:
  queue-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run real transport header with FreeRTOS host mocks (5 repetitions)
        run: |
          for run in 1 2 3 4 5; do
            echo "=== Host transport run ${run}/5 ==="
            bash Boat/tests/run_r30h73_transport_queue_host.sh
          done
      - name: Transport source contract
        run: python -m unittest discover -s Boat/tests -p test_r30h71_transport_handoff_contract.py -v
      - name: Dual-core diagnostic source contract
        run: python -m unittest discover -s Boat/tests -p test_r30h87_dual_core_contract.py -v
