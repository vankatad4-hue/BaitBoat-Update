name: Remote Bulgarian UI font resource
on:
  push:
    branches: [hardware-ready-dual-radio-r1]
    paths:
      - 'Remote/tools/generate_bg_font.sh'
      - '.github/workflows/remote-ui-font.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licensed source font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Generate Bulgarian glyph resource
        run: bash Remote/tools/generate_bg_font.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flytec-bg-font-source-${{ github.sha }}
          path: out/ui-font/
          if-no-files-found: error
